name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 站点约 674MB，单次部署要十几分钟；新推送不能把快完成的部署取消掉。
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate public reading room state
        run: python3 scripts/build-agent-dashboard.py
      - name: Generate public reading progress page
        run: python3 scripts/build-reading-progress.py
      - name: Optimize homepage markup (inline SVG -> sprite)
        run: python3 scripts/optimize_home.py --no-backup
      - name: Verify progress screen and public snapshot
        run: |
          python3 scripts/check-agent-dashboard.py
          python3 scripts/check-team-book-links.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 10 分钟对 674MB 的站点不够，放宽到 30 分钟。
          timeout: 1800000
          error_count: 30
