name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Pages 每次部署都是整包上传（没有增量发布），这些路径不进站点产物，
    # 改动它们时没有必要重传 674MB。
    paths-ignore:
      - 'skills/**'
      - 'scripts/**'
      - 'tools/**'
      - 'overview_gen/**'
      - 'openspec/**'
      - 'docs/**'
      - 'memory/**'
      - 'todo/**'
      - 'team-handoffs/**'
      - 'daily-output/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 关键：不能 cancel in progress。
  # 站点 674MB 单次要十几分钟，补产任务常常一分钟内连推三四个 commit；
  # 一旦 cancel，前一次永远跑不完，只有最后一次能落地 —— 表现就是
  # 「推了半天线上还是旧的」，而且每次重跑都要重新拉 674MB。
  cancel-in-progress: false

jobs:
  # ── 1. 校验 + 打产物：全流程只跑一次 ──────────────────────────────
  # 以前 stage / 门禁 / CDN 上传都串在一个 job 里：Pages 部署（十分钟级）
  # 跑完才轮到七牛全量 PUT，两段最慢的活叠在一起。
  # 现在产物只打一次，Pages 与 CDN 两条腿并行。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 同名覆盖 jpg 时 Kodo 源站已换新对象，但边缘节点 max-age=31536000
      # 仍吐旧图（含合成素封）。放在 checkout 之后立刻刷：刷新只要几秒，
      # 不等十几分钟的 Pages 部署，也避开补产任务频繁推送导致的 cancel。
      - name: Refresh CDN cache (overwritten covers)
        if: hashFiles('assets/data/cdn-refresh.txt') != ''
        run: |
          pip install qiniu
          export QINIU_AK="${{ secrets.QINIU_AK }}"
          export QINIU_SK="${{ secrets.QINIU_SK }}"
          python scripts/refresh_cdn.py --file assets/data/cdn-refresh.txt
        continue-on-error: true
      - name: Generate public reading room state
        run: python3 scripts/build-agent-dashboard.py
      - name: Generate public reading progress page
        run: python3 scripts/build-reading-progress.py
      - name: Optimize homepage markup (inline SVG -> sprite)
        run: python3 scripts/optimize_home.py --no-backup
      - name: Verify progress screen and public snapshot
        run: |
          python3 scripts/check-agent-dashboard.py
          python3 scripts/check-team-book-links.py
      # 防止新书壳页回退到旧版 reader js（章节知识导图会消失）。
      # 真相源 assets/data/reader-js.json，守卫从 git tree 读全站壳页，
      # 任何一本引用不一致就阻断部署。
      - name: Verify reader JS version across all book shells
        run: python3 scripts/check_reader_js.py
      # 封面 / 书架体检：新书只发 outline、漏下封面，会让书架卡退化成渐变素封；
      # 只发 overview、漏跑 combine，会让卡片停在旧模板。两者都在此阻断。
      # 扫描范围是首页实际展示的书（书架卡 + 书墙 BOOKS），不是 hero.json 登记表。
      - name: Verify covers and shelf health on the homepage
        run: |
          python3 tools/check_covers.py
          # --strict：旧模板书（只有 overview.html、没跑 combine）也算失败。
          # 2026-11-18 书架最后 22 本已全部转 combined，门禁可以收紧了。
          python3 tools/check_shelf.py --strict
      - name: Stage publishable site (drop unused fonts / PDFs / dev dirs)
        run: python3 scripts/stage_pages.py
      # 只存一份 674MB：CDN 那条腿直接复用 Pages 的 artifact，
      # 不再额外 upload-artifact 一份（Actions 存储额度 500MB，双份会超）。
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 2. Pages 主站：保持全量发布（GitHub 没有增量接口）─────────────
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 10 分钟对 674MB 的站点不够，放宽到 30 分钟。
          timeout: 1800000
          error_count: 30

  # ── 3. 七牛 CDN：与 Pages 并行，且只传变化的文件 ──────────────────
  # upload_to_qiniu.py 现在会先 batch stat 拉远端 (fsize, hash)，和本地
  # etag 比对一致就跳过。日常一次提交通常只传几 MB，而不是 674MB 全 PUT。
  deploy-cdn:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 只要脚本，不拉 674MB 仓库（sparse checkout 秒级）。
      - name: Checkout scripts only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      # 复用 Pages 的 artifact（内含 artifact.tar），解出来即可，不重复存储。
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _art
      - name: Unpack
        run: |
          # Pages artifact 正常是 artifact.tar；万一取不到（过期/被清理），
          # 只告警不红：Pages 主站照常发布，CDN 下次再补。
          if [ -f _art/artifact.tar ]; then
            mkdir -p _site
            tar -xf _art/artifact.tar -C _site
          else
            echo "::warning::Pages artifact 不可读，本次跳过 CDN 同步"
          fi
      - name: Upload to CDN (qiniu, incremental)
        run: |
          if [ ! -d _site ] || [ -z "$(ls -A _site)" ]; then
            echo "无产物，跳过"
            exit 0
          fi
          pip install qiniu
          export QINIU_AK="${{ secrets.QINIU_AK }}"
          export QINIU_SK="${{ secrets.QINIU_SK }}"
          python scripts/upload_to_qiniu.py --bucket we-read-assets --dir _site --workers 16
