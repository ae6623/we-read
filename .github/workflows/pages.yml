name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Pages 每次部署都是整包上传（没有增量发布），这些路径不进站点产物，
    # 改动它们时没有必要重传 360MB。
    paths-ignore:
      - 'skills/**'
      - 'scripts/**'
      - 'tools/**'
      - 'overview_gen/**'
      - 'openspec/**'
      - 'docs/**'
      - 'memory/**'
      - 'todo/**'
      - 'team-handoffs/**'
      - 'daily-output/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 站点约 674MB，单次部署要十几分钟；新推送不能把快完成的部署取消掉。
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate public reading room state
        run: python3 scripts/build-agent-dashboard.py
      - name: Generate public reading progress page
        run: python3 scripts/build-reading-progress.py
      - name: Optimize homepage markup (inline SVG -> sprite)
        run: python3 scripts/optimize_home.py --no-backup
      - name: Verify progress screen and public snapshot
        run: |
          python3 scripts/check-agent-dashboard.py
          python3 scripts/check-team-book-links.py
      # 防止新书壳页回退到旧版 reader js（章节知识导图会消失）。
      # 真相源 assets/data/reader-js.json，守卫从 git tree 读全站 543 本，
      # 任何一本引用不一致就阻断部署。
      - name: Verify reader JS version across all book shells
        run: python3 scripts/check_reader_js.py
      - name: Stage publishable site (drop unused fonts / PDFs / dev dirs)
        run: python3 scripts/stage_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 10 分钟对 674MB 的站点不够，放宽到 30 分钟。
          timeout: 1800000
          error_count: 30
      - name: Upload to CDN (qiniu)
        run: |
          pip install qiniu
          export QINIU_AK="${{ secrets.QINIU_AK }}"
          export QINIU_SK="${{ secrets.QINIU_SK }}"
          python scripts/upload_to_qiniu.py --bucket we-read-assets --dir _site
