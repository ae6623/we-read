<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="精读归档：日期笔记与整书汇编">
<title>精读归档</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
:root{--paper:#f6f3ed;--card:#fffefa;--ink:#24312e;--muted:#69766f;--green:#244b40;--green2:#315e50;--gold:#bf8247;--line:#e5e0d6;--sage:#dce8df;--serif:"Noto Serif SC","Songti SC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 var(--sans)}
.page{max-width:860px;margin:0 auto;padding:48px 24px 72px}
.note-head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:30px}
.note-head .eyebrow{font-size:.72rem;letter-spacing:.18em;font-weight:700;color:var(--gold);margin:0 0 8px}
.note-head h1{font:600 2rem/1.4 var(--serif);color:var(--green);margin:0 0 10px}
.note-head .meta{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.note-head a{color:var(--green);text-decoration:none;font-size:.88rem}
.note-head a:hover{text-decoration:underline}
section{margin:30px 0}
section h2{font:600 1.3rem/1.5 var(--serif);color:var(--green);margin:0 0 12px;
  padding-left:12px;border-left:4px solid var(--gold)}
section p{margin:.5em 0}
blockquote{margin:14px 0;padding:12px 18px;background:#f5efe4;border-left:3px solid var(--gold);
  border-radius:0 10px 10px 0;color:#4a4436;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:.78rem;background:var(--sage);color:var(--green);border-radius:999px;padding:3px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat b{display:block;color:var(--green);font-size:1rem}
.stat span{color:var(--muted);font-size:.8rem}
.note-list{margin:10px 0;padding-left:20px}
.note-list li{margin:5px 0}
.note-list a{color:var(--green)}
.small{color:var(--muted);font-size:.84rem}
.site-footer{margin-top:44px;padding-top:16px;border-top:1px dashed var(--line);
  color:var(--muted);font-size:.8rem;text-align:center}
@media print{body{background:#fff}}
</style>
</head>
<body>
<main class="page">
  <header class="archive-head">
    <p class="eyebrow">READING ARCHIVE · 精读归档</p>
    <h1>读过的每一本，都留下轨迹</h1>
    <p class="archive-sub">按书归档：开读即有全书视角初版，每天一篇日期笔记，完读汇集成册。</p>
    <div class="archive-count"><strong>01</strong> 本书在读档</div>
  </header>
    <section class="archive-grid" id="archive-grid" aria-label="阅读归档">
      <article class="archive-card" data-search="时势 小 Lin">
        <div class="card-top"><span class="type-tag type-tag-gold">已完结</span><time datetime="2026-10-17">2026.10.17</time></div>
        <h3>《时势》</h3>
        <p>小 Lin · 1 次阅读累计约 3 分钟</p>
        <a class="card-link" href="books/shi-shi/final.html">整书汇编 <span aria-hidden="true">↗</span></a>
      </article>
    </section>
  <footer class="site-footer">归档由 weread-auto 自动维护；<a href="../index.html">返回首页</a>。</footer>
</main>
</body>
</html>
