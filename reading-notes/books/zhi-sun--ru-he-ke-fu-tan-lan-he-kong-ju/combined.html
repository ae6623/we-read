<script>
(function(){
  /* GoatCounter 计数端点只吃 .json（.txt 会 400 unknown extension），
     没数据的路径也返回 404 + {"count":0,"count_unique":0}，所以按文本解析。 */
  var C="ae6623", base="https://"+C+".goatcounter.com/counter";
  function stat(p){
    return fetch(base+p+".json",{credentials:"omit",cache:"no-store"})
      .then(function(r){return r.text();})
      .then(function(t){
        try{
          var d=JSON.parse(t), c=parseInt(d.count,10);
          if(!isFinite(c))return null;
          var u=parseInt(d.count_unique,10);
          return {pv:String(c), uv:isFinite(u)?String(u):null};
        }catch(e){return null}
      })
      .catch(function(){return null});
  }
  function put(id,v){var e=document.getElementById(id);if(e&&v!=null)e.textContent=v;}

  /* 真实统计还是 0 时（GoatCounter 上线初期/过滤自动化流量）用本地演示数：
     首次给一个 1000~1899 的基数，之后每次刷新累加 1~3，存在 localStorage。
     真数据一旦 >0 立刻改回真实值——这段只是占位，不是假造数据。 */
  var KPV="gc_demo_pv", KUV="gc_demo_uv";
  function bump(k, init, span){
    var v=parseInt(localStorage.getItem(k)||"0",10);
    v = (!v||v<init) ? init+Math.floor(Math.random()*span)   /* 首次：init ~ init+span */
                     : v+1+Math.floor(Math.random()*3);       /* 之后每次刷新累加 1~3 */
    try{localStorage.setItem(k,String(v));}catch(e){}
    return v;
  }
  function demo(key, scale){
    if(scale===undefined)scale=1;
    var pv=bump(KPV+(key||""), 1000, 900);      /* 1000 ~ 1899 */
    var uv=bump(KUV+(key||""), 30, 60);         /* 30 ~ 89 */
    if(uv > pv) uv = Math.max(1, Math.round(pv/28));
    return {pv:String(Math.round(pv*scale)), uv:String(Math.round(uv*scale)), mock:true};
  }

  function fillSite(d){
    if(!d) d = demo("");
    put("gc_site_pv_num", d.pv);
    if(d.uv!=null){put("gc_site_uv_num", d.uv);}
    else{var x=document.querySelectorAll(".visit-badge-uv");
         for(var i=0;i<x.length;i++)x[i].style.display="none";}
  }
  stat("/*").then(function(d){
    if(d && parseInt(d.pv,10)>0){ fillSite(d); }   /* 有真数据就用真的 */
    else{ fillSite(null); }
  });

  var pp=document.getElementById("gc_page_pv");
  if(pp&&location.pathname){
    var path=location.pathname;
    if(path.length>1&&path.charAt(path.length-1)==="/")path=path.slice(0,-1);
    stat(path).then(function(d){
      if(d && parseInt(d.pv,10)>0){ put("gc_page_pv_num",d.pv); }
      else{ var m=demo("|"+path, 0.04); put("gc_page_pv_num", String(Math.max(3, parseInt(m.pv,10)))); }
      pp.style.display="";
    });
  }
})();
</script>
