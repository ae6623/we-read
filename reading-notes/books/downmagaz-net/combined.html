/* 合并页外壳 */
body{max-width:960px;margin:0 auto;padding:0 18px 80px;}
.combined-head{padding:34px 0 18px;border-bottom:1px solid #e7e0d2;margin-bottom:8px;}
.combined-head h1{font-size:26px;margin:0 0 10px;}
/* 锚点导航：固定一排 4 个，等宽对齐 */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid #ece4d4;padding:10px 0;margin:14px 0 26px;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  box-shadow:0 2px 10px rgba(120,100,60,.06);}
.navlink{font-size:12.5px;color:#5d5443;text-decoration:none;background:#f6f1e6;border:1px solid #e7ddca;

  text-overflow:ellipsis;}
section{scroll-margin-top:64px;}
/* 一句话主旨：去左侧竖线 */
.mmx-oneline{border-left:none;padding-left:18px;}
/* AI领读章内：AI 大纲原生深层样式 */
.merged-guide .sec{margin:10px 0 14px;padding-left:6px;border-left:2px solid #e5e0d6}
.merged-guide .sec h4{font:600 .98rem/1.6 "Noto Serif SC","Songti SC",Georgia,serif;color:#315e50;margin:.6em 0 .3em}
.merged-guide ul.point{margin:.3em 0;padding-left:20px}
.merged-guide ul.point>li{margin:.35em 0}
.merged-guide ul.quote{margin:.25em 0 .25em 20px;padding-left:18px;list-style:none}
.merged-guide ul.quote::before{content:"原句";display:block;font-size:.72rem;color:#bf8247;
  letter-spacing:.1em;margin:.15em 0 .1em;font-weight:600}
.merged-guide ul.quote.quote-node{margin-top:.5em;padding-top:.4em;border-top:1px dashed #eadfc9}
.merged-guide ul.quote.quote-node::before{content:"原句 · 本小节汇总"}
.merged-guide ul.quote>li{color:#4a4436;font-size:.93rem;margin:.2em 0;padding-left:10px;border-left:2px solid #bf8247}
/* 模块内子内容（AI领读除外，它有专属深层样式）：左缩进 + 正文与标题分层 */
section.mmx-mod>ul,section.mmx-mod>ol,section.mmx-mod>div,
section.mmx-mod>p:not(.mmx-mod-note),
section.card:not(.merged-guide)>ul,section.card:not(.merged-guide)>ol,
section.card:not(.merged-guide)>div,section.card:not(.merged-guide)>p:not(.mmx-mod-note){
  padding-left:16px;}
section.mmx-mod li,section.mmx-mod p:not(.mmx-mod-note),
section.card:not(.merged-guide) li,section.card:not(.merged-guide) p:not(.mmx-mod-note){
  color:#4a4436;font-size:.93rem;line-height:1.78;}
/* 核心观点初判：外链 mmx-guide.css 的「观点N」前缀是绝对定位，在本页版式里和标题叠字，
   且此前要求去掉「观点1/2/3」前缀 —— 这里整条关掉（外链 CSS 不在页面内，只能内联覆盖）。 */
.mmx-views li{padding-left:0 !important;}
.mmx-views li:before,.mmx-views li::before{
  content:none !important;display:none !important;counter-increment:none !important;}
</style>
