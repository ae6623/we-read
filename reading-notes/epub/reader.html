<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17181b">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>原书阅读器</title>
<style>
:root{
  --bg:#fbfaf7;--panel:#ffffff;--fg:#2b2b2b;--muted:#8b8377;--line:#e3ded2;
  --accent:#b07d3c;--soft:#faf6ee;--bar:#f5f2ea;
}
html[data-theme="dark"]{
  --bg:#17181b;--panel:#202126;--fg:#d8d5ce;--muted:#8a877f;--line:#33353a;
  --accent:#d9a96b;--soft:#24252a;--bar:#1d1e22;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);
     color:var(--fg);overflow:hidden}
a{color:var(--accent)}
.bar{height:56px;display:flex;align-items:center;gap:7px;padding:0 12px;
     background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:20}
/* 标题吃掉剩余空间，能显示多长就多长 */
.bar strong{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;
     overflow:hidden;text-overflow:ellipsis}
button,input,select{font:inherit}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
     border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.on{border-color:var(--accent);color:var(--accent)}
.bar button{display:inline-flex;align-items:center;justify-content:center;
     flex:0 0 auto;min-width:34px;height:34px;padding:0 9px}
.bar svg{display:block}
#dl{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
     min-width:34px;height:34px;padding:0 9px;background:var(--panel);color:var(--fg);
     border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:16px}
#dl:hover{border-color:var(--accent)}
/* 放大镜点开的搜索浮层：不占顶栏，标题完整保留 */
#searchPop{position:absolute;top:calc(100% + 6px);right:8px;z-index:40;
     display:flex;align-items:center;gap:6px;
     width:min(360px,calc(100vw - 16px));padding:8px;background:var(--panel);
     border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px #00000038}
#searchPop[hidden]{display:none}
#searchPop #q{flex:1 1 auto;min-width:0;width:auto;padding:7px 9px;
     border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:13px}
#searchPop button{flex:0 0 auto;padding:7px 9px;height:auto;min-width:0}
.side{position:fixed;top:56px;bottom:0;left:0;width:272px;background:var(--panel);
      border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:15;
      transition:transform .2s}
.side.hidden{transform:translateX(-100%)}
/* 目录展开时，点右侧正文区即收起目录；顶栏与侧栏本身不受影响 */
#sideMask{position:fixed;top:56px;left:272px;right:0;bottom:0;z-index:14;display:none}
#sideMask.on{display:block}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{flex:1 1 0;min-width:0;border:0;border-radius:0;background:transparent;
     padding:10px 2px;font-size:11.5px;white-space:nowrap}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.tabs #findBtn{flex:0 0 34px;padding:10px 0;font-size:13px;border-left:1px solid var(--line)}
.tabs #findBtn.on{color:var(--accent);box-shadow:none}
#filter{margin:9px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;
        background:var(--bg);color:var(--fg);font-size:12px}
#filter.flash{border-color:var(--accent);box-shadow:0 0 0 2px #d9a96b33}
/* 上传面板：只在「上传」Tab 显示 */
#uploadPane{flex:0 0 auto;margin:0 9px 9px;padding:10px;background:var(--soft);
     border:1px solid var(--line);border-radius:8px;display:grid;gap:7px}
#uploadPane[hidden]{display:none}
#uploadPane .up-hd{font-size:12px;font-weight:700;color:var(--fg)}
#uploadPane label{font-size:11px;color:var(--muted)}
.up-row{display:flex;gap:5px}
.up-row input{flex:1 1 auto;min-width:0;padding:6px 7px;font-size:11px;
     border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.up-row button{flex:0 0 auto;padding:6px 8px;font-size:11px}
.up-state{font-size:11px;color:var(--muted);line-height:1.5}
.up-state.ok{color:#3aa06a}.up-state.bad{color:#d98b4a}
.up-drop{padding:12px 8px;text-align:center;font-size:11.5px;line-height:1.6;
     border:1px dashed var(--line);border-radius:8px;cursor:pointer;color:var(--muted)}
.up-drop:hover,.up-drop.over{border-color:var(--accent);color:var(--accent)}
.up-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:none}
.up-bar.on{display:block}
.up-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.up-log{font-size:10.5px;line-height:1.55;color:var(--muted);max-height:120px;overflow:auto}
.up-note{font-size:10.5px;line-height:1.55;color:var(--muted);margin:0}
#list{flex:1;overflow:auto;padding:0 6px 14px}
#list a{display:block;padding:8px 9px;border-radius:5px;text-decoration:none;
        color:var(--fg);font-size:12.5px;line-height:1.45;border-left:2px solid transparent}
#list a:hover{background:var(--soft)}
#list a.cur{background:var(--soft);border-left-color:var(--accent);color:var(--accent)}
#list a small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#list .grp{padding:11px 9px 4px;color:var(--muted);font-size:11px;letter-spacing:.05em}
main{position:absolute;top:56px;left:272px;right:0;bottom:0;background:var(--panel)}
.side.hidden~main{left:0}
#viewer{width:100%;height:100%}
#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
        background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:7px 16px;font-size:12px;color:var(--muted);z-index:70;display:none;
        box-shadow:0 3px 14px #00000018}
#results{position:fixed;top:56px;right:0;width:340px;max-height:70vh;overflow:auto;
         background:var(--panel);border:1px solid var(--line);border-left-width:3px;
         border-left-color:var(--accent);z-index:25;display:none;padding:8px}
#results .r{display:block;padding:9px;border-bottom:1px solid var(--line);
            text-decoration:none;color:var(--fg);font-size:12px;line-height:1.6}
#results .r:hover{background:var(--soft)}
#results .r em{font-style:normal;color:var(--accent)}
#results .hd{padding:8px;color:var(--muted);font-size:12px}
#warn{background:#fff4e2;color:#7a5a20;padding:9px 14px;font-size:12px;
      border-bottom:1px solid #e8cf9f;display:none}
html[data-theme="dark"] #warn{background:#3a2f1c;color:#e0c58e;border-color:#5c4a29}
.foot{position:fixed;right:10px;bottom:6px;font-size:11px;z-index:10;opacity:.55}
.foot a{color:inherit;text-decoration:none}
@media(max-width:900px){
  .side{box-shadow:4px 0 20px #00000022}
  main,.side.hidden~main{left:0}
  .bar{gap:5px;padding:0 8px}
  .bar strong{font-size:13px}
  .bar button,#dl{min-width:32px;height:32px;padding:0 7px}
  .tabs button{font-size:11px;padding:10px 1px}
  .tabs #findBtn{flex-basis:30px;font-size:12px}
  #searchPop{right:6px;width:calc(100vw - 12px)}
  #results{width:100%;max-height:55vh}
}
</style>
<link rel="stylesheet" href="aa-panel.css">
</head>
<body>
<div id="warn">当前是 <code>file://</code> 打开，浏览器会拦截 epub 文件读取。请用线上 Pages 地址，或在本目录起一个静态服务器（例如 <code>python -m http.server</code>）后访问。</div>
<header class="bar">
  <button id="shelfBtn" title="展开/收起目录">☰</button>
  <strong id="bookTitle">载入中…</strong>
  <button id="searchBtn" title="全书搜索" aria-label="全书搜索"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></button>
  <button id="aaBtn" title="Aa 阅读设置">Aa</button>
  <a id="dl" download title="下载 EPUB">↓</a>
  <div id="searchPop" hidden>
    <input id="q" type="search" placeholder="全书搜索，回车执行" aria-label="全书搜索">
    <button id="searchGo" type="button">搜索</button>
    <button id="searchClose" type="button" aria-label="关闭搜索">✕</button>
  </div>
</header>

<aside class="side" id="side">
  <div class="tabs">
    <button data-tab="toc" class="on">目录</button>
    <button data-tab="shelf">云端☁️</button>
    <button data-tab="upload">上传</button>
    <button id="findBtn" title="图书搜索：切到云端书目并聚焦筛选" aria-label="图书搜索">🔍</button>
  </div>
  <input id="filter" type="search" placeholder="筛选书名或章节">
  <div id="uploadPane" hidden>
    <div class="up-hd">上传 EPUB 图书</div>
    <label for="apiBase">上传服务地址</label>
    <div class="up-row">
      <input id="apiBase" type="text" spellcheck="false" placeholder="在线服务地址（自动读取）">
      <button id="apiCheck" type="button">检查</button>
    </div>
    <div id="apiState" class="up-state">正在检测在线上传服务…</div>
    <div id="drop" class="up-drop">点此选择，或把 .epub 拖到这里<br>单本 ≤ 15 MB · 支持多选</div>
    <input id="upFile" type="file" accept=".epub,application/epub+zip" multiple hidden>
    <div class="up-bar" id="upBar"><i id="upBarIn"></i></div>
    <div id="upLog" class="up-log"></div>
    <p class="up-note">上传后保存在服务端并入队补笔记，由读书 Agent 认领，不代表笔记已生成。文件进的是公开仓库/沙箱，noindex 不等于私有。</p>
  </div>
  <nav id="list"></nav>
</aside>
<div id="sideMask" aria-hidden="true"></div>

<main><div id="viewer"></div></main>
<div id="status"></div>
<div id="results"></div>
<div class="foot"><a href="index.html">入口</a></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script src="aa-panel.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var AA = window.EpubAA;
  var params = new URLSearchParams(location.search);
  var bookId = params.get("book");
  var book = null, rendition = null, toc = [], shelf = [], uploads = [], curHref = "";
  var tab = "toc", searching = false;
  var bookSrc = params.get("src") === "upload" ? "upload" : "cloud";
  var apiBase = (function(){
    var saved = "";
    try{ saved = localStorage.getItem("epub-upload-api")||"" }catch(e){}
    if(saved) return saved.replace(/\/+$/,"");
    // 本机服务同源托管时自动命中；线上 Pages 由 upload-api.json 提供云端沙箱地址
    if(location.protocol.indexOf("http")===0 && /^(127\.0\.0\.1|localhost)$/.test(location.hostname))
      return location.origin;
    return "";
  })();
  var relocatedCb = null, lastHi = null, dynCss = "";
  var c0 = AA ? AA.cfg() : {theme:"dark",fs:108,lh:1.85,spread:"none",flow:"paginated"};
  var lastSpread = c0.spread, lastFlow = c0.flow;

  var BOOK_THEME = {
    dark:   {bg:"#202126",fg:"#d8d5ce",head:"#d9a96b",line:"#33353a",mark:"#7f7c75",accent:"#9ed0af"},
    cream:  {bg:"#fffdf6",fg:"#3b453e",head:"#244b40",line:"#e8e4d5",mark:"#a49c8e",accent:"#8a6a35"},
    light:  {bg:"#ffffff",fg:"#2b2b2b",head:"#5b5145",line:"#e3ded2",mark:"#a49c8e",accent:"#b07d3c"},
    green:  {bg:"#eef7ef",fg:"#2f4237",head:"#1e4d37",line:"#b9dcc0",mark:"#6f8f77",accent:"#1e5c41"}
  };

  if(location.protocol === "file:") $("warn").style.display = "block";

  function status(msg,ms){
    var el=$("status"); el.textContent=msg; el.style.display="block";
    if(ms) clearTimeout(status._t), status._t=setTimeout(function(){el.style.display="none"},ms);
  }
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function format(n){return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}

  /* ── Aa 面板适配层：主题 / 字号 / 行距 / 字体 / 双栏 / 滚动 ── */
  function injectDyn(){
    if(!rendition || !dynCss) return;
    (rendition.getContents()||[]).forEach(function(c){
      try{ c.addStylesheetCss(dynCss, "aa-dyn"); }catch(e){}
    });
  }
  function applyCfg(c){
    var t = BOOK_THEME[c.theme] || BOOK_THEME.dark;
    var pm = c.lh <= 1.7 ? .55 : c.lh <= 1.9 ? .8 : 1.15;
    dynCss = (AA ? AA.fontFaceRule() : "") +
      "html,body{background:"+t.bg+";color:"+t.fg+";}" +
      "body{line-height:"+c.lh+";}" +
      "p{line-height:"+c.lh+";margin-bottom:"+pm+"em;}" +
      "h2.chapter{color:"+t.head+";border-bottom:1px solid "+t.line+";}" +
      ".pgmark{color:"+t.mark+";}" +
      "section.page{border-bottom:1px dashed "+t.line+";}" +
      "a{color:"+t.accent+";}" +
      ".epub-speaking{background:rgba(7,193,96,.12);box-shadow:inset 3px 0 0 #07c160;border-radius:4px;}";
    if(!rendition) return;
    injectDyn();
    try{ rendition.themes.fontSize(c.fs+"%"); }catch(e){}
    try{ rendition.themes.font(AA ? AA.fontFamily() : ""); }catch(e){}
    if(lastSpread !== c.spread){ lastSpread = c.spread; try{ rendition.spread(c.spread); }catch(e){} }
    if(lastFlow !== c.flow){ lastFlow = c.flow; try{ rendition.flow(c.flow); }catch(e){} }
    try{ rendition.resize(); }catch(e){}
  }
  function visibleParagraphs(){
    var out = [], seen = {};
    if(!rendition) return out;
    (rendition.getContents()||[]).forEach(function(c){
      var doc = c.document; if(!doc || !doc.body) return;
      var win = doc.defaultView; if(!win) return;
      var W = win.innerWidth || 1024, Hh = win.innerHeight || 768;
      var nodes = doc.body.querySelectorAll("p, li, blockquote, h1, h2, h3, h4, h5, h6, div");
      for(var i=0;i<nodes.length;i++){
        var el = nodes[i];
        if(el.classList && el.classList.contains("pgmark")) continue;
        if(el.querySelector("p, li, blockquote, div, section")) continue;  // 只取最内层文字块
        var txt = String(el.innerText || el.textContent || "").replace(/\s+/g," ").trim();
        if(txt.length < 2 || seen[txt]) continue;
        var r = el.getBoundingClientRect();
        if(r.bottom <= 2 || r.top >= Hh - 2 || r.right <= 2 || r.left >= W - 2) continue;
        seen[txt] = 1; out.push({text:txt, el:el});
      }
    });
    return out;
  }
  function highlight(el){
    if(lastHi && lastHi.classList) lastHi.classList.remove("epub-speaking");
    lastHi = el || null;
    if(lastHi && lastHi.classList) lastHi.classList.add("epub-speaking");
  }
  function jumpChapter(delta){
    if(!toc.length||!rendition) return;
    var i=-1;
    toc.forEach(function(t,k){ if(curHref && t.href.indexOf(curHref)>=0) i=k });
    var n=Math.max(0,Math.min(toc.length-1,i+delta));
    rendition.display(toc[n].href);
  }
  function escapeHandled(){
    var sp = $("searchPop");
    if(sp && !sp.hidden){ closeSearch(); return true; }
    var res = $("results");
    if(res && res.style.display === "block"){ res.style.display="none"; return true; }
    if(isSideOpen()){ closeSide(); return true; }
    return false;
  }
  if(AA) AA.init({
    onCfg: applyCfg,
    page: function(d){ if(rendition) rendition[d<0?"prev":"next"](); },
    chapter: jumpChapter,
    back: function(){ location.href = "index.html"; },
    pageText: visibleParagraphs,
    highlight: highlight,
    onRelocated: function(cb){ relocatedCb = cb; },
    resize: function(){ if(rendition) try{ rendition.resize(); }catch(e){} },
    notify: status,
    escape: escapeHandled,
    focusSearch: openSearch,
    openSearch: openSearch
  });

  /* ── 侧栏 / 目录 ── */
  function flatten(items,out){
    out = out || [];
    (items||[]).forEach(function(it){
      if(it.href) out.push({href:it.href,label:(it.label||"").trim()||it.href});
      if(it.subitems&&it.subitems.length) flatten(it.subitems,out);
    });
    return out;
  }
  function renderList(){
    var kw = ($("filter").value||"").trim().toLowerCase();
    var el=$("list"), h=[];
    $("uploadPane").hidden = (tab !== "upload");
    $("filter").placeholder = tab==="upload" ? "筛选已上传书名" :
                              tab==="shelf" ? "筛选云端书名" : "筛选章节";
    document.querySelectorAll(".tabs button[data-tab]").forEach(function(b){
      b.classList.toggle("on", b.dataset.tab===tab);
    });
    if(tab==="shelf" || tab==="upload"){
      var cat = tab==="upload" ? uploads : shelf;
      var src = tab==="upload" ? "&amp;src=upload" : "";
      var isUpload = tab==="upload";
      if(!cat.length) h.push('<div class="grp">'+
        (isUpload ? "还没有上传的书。在上方选择或拖入 .epub。" : "云端书目暂不可用")+'</div>');
      cat.forEach(function(b){
        if(kw && ((b.title||"")+(b.author||"")).toLowerCase().indexOf(kw)<0) return;
        var cur = b.id===bookId && ((bookSrc==="upload")===isUpload);
        var sub = isUpload
          ? (b.chapters||0)+' 章 · '+((b.bytes||0)/1048576).toFixed(1)+' MB · '+esc(b.note_status||'待补笔记')
          : format(b.pages)+' 页 · '+format(b.chars)+' 字 · '+(b.chapters||0)+' 章 · '+
            ((b.bytes||0)/1048576).toFixed(1)+' MB';
        h.push('<a href="reader.html?book='+encodeURIComponent(b.id)+src+'"'+
          (cur?' class="cur"':'')+'>'+esc(b.title)+'<small>'+sub+'</small></a>');
      });
    }else{
      toc.forEach(function(t,i){
        if(kw && t.label.toLowerCase().indexOf(kw)<0) return;
        var cur = curHref && t.href.indexOf(curHref)>=0;
        h.push('<a href="#'+i+'" data-i="'+i+'"'+(cur?' class="cur"':'')+'>'+esc(t.label)+'</a>');
      });
    }
    el.innerHTML = h.join("") || '<div class="grp">无匹配结果</div>';
    el.querySelectorAll("a[data-i]").forEach(function(a){
      a.onclick=function(ev){ev.preventDefault();var i=+a.dataset.i;
        if(toc[i]) rendition.display(toc[i].href); closeSide();};
    });
  }
  function isSideOpen(){ return !$("side").classList.contains("hidden") }
  function syncMask(){ $("sideMask").classList.toggle("on", isSideOpen()); }
  function setSide(open){
    $("side").classList.toggle("hidden", !open);
    syncMask();
    // 侧栏宽度变化后让 epub.js 重新分页（等 0.2s 的侧栏动画走完）
    setTimeout(function(){ if(rendition) try{ rendition.resize(); }catch(e){} }, 230);
  }
  function closeSide(){ setSide(false); }
  $("shelfBtn").onclick=function(){ setSide(!isSideOpen()) };
  $("sideMask").addEventListener("click", closeSide);
  // 手机窄屏默认直接看正文（目录展开时正文区只剩百来像素）；点 ☰ 展开，点右侧收起
  if(innerWidth<=900){ $("side").classList.add("hidden"); }
  syncMask();
  $("filter").oninput=renderList;
  document.querySelectorAll(".tabs button[data-tab]").forEach(function(b){
    b.onclick=function(){
      tab=b.dataset.tab;
      $("findBtn").classList.remove("on");
      renderList();
      if(tab==="upload" && !apiChecked) checkApi();
    };
  });

  /* ── 图书搜索🔍：切到云端☁️书目并聚焦筛选框，快速找书 ── */
  $("findBtn").onclick=function(){
    tab="shelf";
    this.classList.add("on");
    renderList();
    var f=$("filter");
    f.focus(); f.select();
    f.classList.add("flash");
    setTimeout(function(){ f.classList.remove("flash") },900);
    if(!f.value.trim()) status("输入书名筛选云端书目",2000);
  };

  /* ── 上传：在线沙箱服务（或本机服务）接收，落盘 + 入队补笔记 ── */
  var apiChecked = false;
  function setApiState(msg, cls){
    var e=$("apiState"); e.textContent=msg; e.className="up-state"+(cls?" "+cls:"");
  }
  function upLog(msg){
    var e=$("upLog"); e.innerHTML=esc(msg)+"<br>"+e.innerHTML;
  }
  function saveApi(){ try{ localStorage.setItem("epub-upload-api",apiBase) }catch(e){} }
  function catJson(name){
    return fetch(name+"?_="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json() })
      .catch(function(){ return {books:[]} });
  }
  /* 上传书目优先从在线服务 /api/uploads 拉（file 是跨域可读的绝对 URL），
     服务不可用才回退仓库里的 uploads.json（Pages 同源）。 */
  function catUploads(){
    if(!apiBase) return catJson("uploads.json");
    return fetch(apiBase+"/api/uploads?_="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json() })
      .catch(function(){ return catJson("uploads.json") });
  }
  function checkApi(){
    apiChecked=true;
    if(!apiBase){
      setApiState("未配置上传服务地址。云端部署后会自动读取 upload-api.json，也可在上方填写。","bad");
      return;
    }
    fetch(apiBase+"/api/health?_="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json() })
      .then(function(d){
        setApiState("服务在线 · "+(d.mode==="sandbox"?"云端沙箱":"本机仓库")+
          " · 上传目录 "+(d.upload_dir||"uploads")+
          " · 队列 r"+(d.registry_revision!=null?d.registry_revision:"?"),"ok");
        return refreshUploads();
      })
      .catch(function(err){
        setApiState("上传服务不可用（"+err.message+"）。请确认云端应用已部署，或在上方填写服务地址。","bad");
      });
  }
  function refreshUploads(){
    return catUploads()
      .then(function(d){ uploads=d.books||[]; if(tab==="upload") renderList(); })
      .catch(function(){ uploads=[]; if(tab==="upload") renderList(); });
  }
  function uploadOne(file){
    return new Promise(function(resolve){
      var xhr=new XMLHttpRequest();
      xhr.open("POST",apiBase+"/api/upload?name="+encodeURIComponent(file.name));
      xhr.setRequestHeader("Content-Type","application/octet-stream");
      xhr.setRequestHeader("X-File-Name",encodeURIComponent(file.name));
      xhr.upload.onprogress=function(ev){
        if(ev.lengthComputable){
          $("upBar").classList.add("on");
          $("upBarIn").style.width=Math.round(ev.loaded/ev.total*100)+"%";
        }
      };
      xhr.onload=function(){
        $("upBar").classList.remove("on"); $("upBarIn").style.width="0";
        var d={}; try{ d=JSON.parse(xhr.responseText||"{}") }catch(e){}
        if(xhr.status>=200 && xhr.status<300 && d.ok){
          upLog("✓ "+file.name+" → "+d.book_id+
            (d.queued?" · 已入队补笔记（registry r"+d.registry_revision+"）":" · 已更新，未重复入队"));
        }else{
          upLog("✗ "+file.name+"："+(d.error||("HTTP "+xhr.status)));
        }
        resolve(d);
      };
      xhr.onerror=function(){
        $("upBar").classList.remove("on");
        upLog("✗ "+file.name+"：网络错误，检查服务地址与 CORS");
        resolve({});
      };
      $("upBar").classList.add("on");
      xhr.send(file);
    });
  }
  function uploadFiles(files){
    var list=Array.prototype.filter.call(files||[],function(f){return /\.epub$/i.test(f.name)});
    if(!list.length){ upLog("请选择 .epub 文件"); return }
    setApiState("正在上传 "+list.length+" 本…","");
    var chain=Promise.resolve();
    list.forEach(function(f){ chain=chain.then(function(){ return uploadOne(f) }) });
    chain.then(function(){
      setApiState("上传结束，结果见下方日志","ok");
      return refreshUploads();
    }).then(function(){ if(tab==="upload") renderList(); });
  }
  $("apiBase").value=apiBase;
  $("apiBase").onchange=function(){
    apiBase=(this.value||"").trim().replace(/\/+$/,"")||apiBase;
    this.value=apiBase; saveApi(); checkApi();
  };
  $("apiCheck").onclick=checkApi;
  $("drop").onclick=function(){ $("upFile").click() };
  $("upFile").onchange=function(){ uploadFiles(this.files); this.value="" };
  ["dragenter","dragover"].forEach(function(t){
    $("drop").addEventListener(t,function(e){ e.preventDefault(); $("drop").classList.add("over") });
  });
  ["dragleave","dragend"].forEach(function(t){
    $("drop").addEventListener(t,function(e){ e.preventDefault(); $("drop").classList.remove("over") });
  });
  $("drop").addEventListener("drop",function(e){
    e.preventDefault(); $("drop").classList.remove("over");
    uploadFiles(e.dataTransfer && e.dataTransfer.files);
  });

  /* 顶栏只留：目录 / 标题 / 放大镜 / Aa / 下载；翻页、主题、字号等全在 Aa 面板 */
  $("aaBtn").onclick=function(){ if(AA) AA.togglePanel() };

  // ---- 全书搜索：逐章按需 load，绝不一次性解出全文
  function search(q){
    if(!book||!q||searching) return;
    searching=true;
    var box=$("results"); box.style.display="block";
    box.innerHTML='<div class="hd">搜索「'+esc(q)+'」中…</div>';
    var found=[], ql=q.toLowerCase(), items=book.spine.spineItems||[];
    var i=0;
    function step(){
      if(i>=items.length || found.length>=60){ done(); return }
      var item=items[i++];
      Promise.resolve()
        .then(function(){return item.load(book.load.bind(book))})
        .then(function(res){
          var text = typeof res==="string" ? res.replace(/<[^>]+>/g," ")
                    : (res&&res.documentElement ? res.documentElement.textContent||"" : "");
          var idx=text.toLowerCase().indexOf(ql);
          if(idx>=0){
            var label=(toc.filter(function(t){return t.href.indexOf(item.href)>=0})[0]||{}).label||item.href;
            found.push({href:item.href,label:label,
              snippet:text.slice(Math.max(0,idx-24),idx+70).replace(/\s+/g," ")});
          }
          if(item.unload) try{item.unload()}catch(e){}
        })
        .catch(function(){})
        .then(step);
    }
    function done(){
      searching=false;
      var h='<div class="hd">「'+esc(q)+'」 · '+found.length+' 个章节命中'+
            (found.length>=60?'（已达上限）':'')+'</div>';
      found.forEach(function(f){
        h+='<a class="r" href="'+esc(f.href)+'" data-href="'+esc(f.href)+'">'+
           '<em>'+esc(f.label)+'</em><br>'+esc(f.snippet)+'…</a>';
      });
      box.innerHTML=h;
      box.querySelectorAll("a[data-href]").forEach(function(a){
        a.onclick=function(ev){ev.preventDefault();rendition.display(a.dataset.href);box.style.display="none";closeSide()};
      });
      status("搜索完成："+found.length+" 个章节",2200);
    }
    step();
  }
  /* 放大镜 → 顶栏下方浮层；搜索执行后自动收起，结果面板照常显示 */
  function openSearch(){
    if(AA && AA.closePanel) AA.closePanel();   // 搜索浮层与 Aa 面板不叠在一起
    $("searchPop").hidden=false;
    var qi=$("q");
    try{ qi.focus(); qi.select(); }catch(e){}   // 用户手势内同步聚焦，手机能直接弹键盘
    setTimeout(function(){ try{ qi.focus(); qi.select(); }catch(e){} },0);
  }
  function closeSearch(){ $("searchPop").hidden=true; }
  function runSearch(){
    var v=$("q").value.trim();
    if(!v){ $("q").focus(); return }
    search(v); closeSearch();
  }
  $("searchBtn").onclick=function(e){
    e.stopPropagation();
    if($("searchPop").hidden) openSearch(); else closeSearch();
  };
  $("searchGo").onclick=runSearch;
  $("searchClose").onclick=closeSearch;
  $("q").onkeydown=function(e){
    if(e.key==="Enter"){ runSearch(); e.preventDefault(); }
    else if(e.key==="Escape"){ closeSearch(); e.preventDefault(); }
  };
  $("q").onchange=function(){ if(!$("searchPop").hidden && this.value.trim()) runSearch(); };
  document.addEventListener("click",function(e){
    var p=$("searchPop");
    if(p.hidden || p.contains(e.target) || e.target===$("searchBtn")) return;
    closeSearch();
  });

  // ---- 启动：先取云端 API 地址，再分别拉云端/上传清单，互不污染
  catJson("upload-api.json").then(function(cfg){
    var hasSaved=false; try{ hasSaved=!!localStorage.getItem("epub-upload-api") }catch(e){}
    if(!hasSaved && cfg && cfg.base){
      apiBase=String(cfg.base).trim().replace(/\/+$/,"");
      $("apiBase").value=apiBase;
    }
    return Promise.all([catJson("epubs.json"), catUploads()]);
  })
    .then(function(res){
      shelf=res[0].books||[]; uploads=res[1].books||[];
      if(bookSrc==="upload") tab="upload";
      renderList();
      if(tab==="upload" && !apiChecked) checkApi();
      var cat = bookSrc==="upload" ? uploads : shelf;
      if(!bookId){ bookId=(cat[0]||shelf[0]||{}).id; }
      var meta=cat.filter(function(b){return b.id===bookId})[0];
      if(!meta){ status("未找到该书，请从书架选择",6000); tab=bookSrc==="upload"?"upload":"shelf"; renderList(); return }
      $("bookTitle").textContent=meta.title;
      document.title=meta.title+" · 原书阅读器";
      // 上传书：API 清单里的 file 已是绝对 URL；仓库清单回退时拼服务的 /uploads/ 路由
      // EPUB 大文件托管在独立 Pages 仓库（同为 ae6623.github.io，同源无需 CORS）。
      // 本地联调可用 ?assets=http://127.0.0.1:8771/ 覆盖。
      var ASSET_BASE = (function () {
        try {
          var q = new URLSearchParams(location.search).get("assets");
          if (q) return q.replace(/\/?$/, "/");
        } catch (e) {}
        /* EPUB 一律由 GitHub Pages 承接（响应带 Access-Control-Allow-Origin: *），
           所以无论页面部署在 ae6623.github.io 还是 cdn.js-dev.cn 都能跨域取书。
           本地联调用 ?assets= 覆盖。 */
        return "https://ae6623.github.io/we-read-assets/reading-notes/epub/";
      })();
      var fileUrl = meta.file;
      if(ASSET_BASE && !/^https?:|^\/\//i.test(fileUrl||""))
        fileUrl = ASSET_BASE + String(fileUrl||"").replace(/^\/+/, "");
      if(bookSrc==="upload" && apiBase && apiBase!==location.origin && !/^https?:/i.test(fileUrl||""))
        fileUrl = apiBase + "/uploads/" + String(fileUrl||"").split("/").pop();
      $("dl").href=fileUrl; $("dl").setAttribute("download",meta.title+".epub");

      book=ePub(fileUrl);
      rendition=book.renderTo("viewer",{
        width:"100%",height:"100%",
        manager:"default",           // 关键：一次只挂载一个章节，正文再长也不卡
        flow:c0.flow,spread:c0.spread,
        allowScriptedContent:false
      });
      // 每个新挂载的章节都补上当前版式（主题/行距/字体/朗读高亮）
      rendition.hooks.content.register(function(contents){
        try{ contents.addStylesheetCss(dynCss || "", "aa-dyn"); }catch(e){}
      });
      // Aa 面板：区域点击、长按、iframe 内方向键
      if(AA) AA.bindFrame(rendition);
      applyCfg(c0);

      book.loaded.navigation.then(function(nav){
        toc=flatten(nav.toc); renderList();
      }).catch(function(){});
      rendition.on("relocated",function(loc){
        if(loc&&loc.start){
          curHref=loc.start.href||"";
          try{localStorage.setItem("epub-cfi-"+bookId,loc.start.cfi||"")}catch(e){}
          renderList();
        }
        if(relocatedCb) try{ relocatedCb(); }catch(e){}
      });
      var saved="";
      try{saved=localStorage.getItem("epub-cfi-"+bookId)||""}catch(e){}
      rendition.display(saved||undefined).then(function(){ applyCfg(AA?AA.cfg():c0); })
        .catch(function(){rendition.display().then(function(){ applyCfg(AA?AA.cfg():c0); })});
      status("已载入 · "+meta.chapters+" 章 · 按章节分段加载",3200);
    })
    .catch(function(err){
      status("清单读取失败："+err.message,8000);
    });
})();
</script>
