<!-- Archive UI fragment; follow skills/luoyu-reading/references/archive-ui.md.
     Include assets/css/book-link-drawer.css using the page's relative path.
     Render the drawer only when verified attached resources exist.
     For an unstarted candidate without resources, keep only its title state icon,
     existing official book link and stable card id; do not render an empty drawer.
     Add one visible reading-state-legend per list, not repeated prose per card.
     This example is for confirmed started/selectively-read, unfinished content.
     Never infer current live execution, completion or reading from resource links. -->
<h4><span class="book-reading-state" data-reading-status="reading" role="img" aria-label="已开始亲读；选择性阅读，全书未完读" title="已开始亲读；选择性阅读，全书未完读"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Z"/><path d="M12 5v15M6 8l3 1M15 9l3-1"/></svg></span><a href="{{verified_official_book_url}}">{{book_title}}</a></h4>
<details class="book-link-drawer">
  <summary><span>阅读入口</span><span class="drawer-count">2 项</span></summary>
  <ol class="book-link-list">
    <li><div class="drawer-item"><a href="{{overview_url}}">全书视角初版</a></div></li>
    <li><div class="drawer-item"><a href="{{date_note_url}}">{{date}} 日期笔记</a><span class="drawer-note">{{verified_reading_status}}</span></div></li>
  </ol>
</details>
