<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书单详情 · 书卡频道</title>
<link rel="stylesheet" href="app.css">
<style>
/* 书单详情按目录排：一行两本，单本不至于拉成一条横线 */
.wrap{max-width:900px}
.hero{padding:clamp(6px,1.2vh,14px) 0 clamp(16px,2.6vh,26px);border-bottom:1px solid oklch(0.3 0.014 62)}
.hero .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(22px,3.4vw,36px);line-height:1.3;letter-spacing:.02em;
}
.hero .goal{
  margin-top:13px;max-width:62ch;
  font-size:clamp(13px,1.4vw,14.5px);line-height:1.95;color:oklch(0.75 0.018 66);
}
.stats{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);letter-spacing:.05em}
.stats i{font-family:var(--font-latin);font-style:normal;font-size:18px;color:var(--paper);margin-right:5px}

.stage{padding:clamp(20px,2.6vh,28px) 0 2px}
.stage-head{display:flex;gap:14px;align-items:flex-start}
.stage-no{
  flex:none;font-family:var(--font-latin);font-size:clamp(24px,3.2vw,36px);
  line-height:.92;color:oklch(0.44 0.02 62);letter-spacing:-.02em;
}
.stage-head h2{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(15.5px,1.9vw,20px);line-height:1.42;letter-spacing:.03em;
}
.stage-aim{margin-top:5px;font-size:12.8px;line-height:1.7;color:oklch(0.7 0.018 66)}
.stage-tip{
  margin:11px 0 2px;padding:9px 13px;border-left:2px solid oklch(0.6 0.06 70);
  background:oklch(0.235 0.014 62);border-radius:0 4px 4px 0;
  font-size:12.3px;line-height:1.75;color:oklch(0.75 0.018 66);
}

.books{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px;list-style:none;align-items:start}
/* 窄屏一列，宽屏两列：单列拉到 700px 时文字只占左边三分之一，右边全空 */
@media (min-width:760px){ .books{grid-template-columns:1fr 1fr;gap:10px} }

.bk{
  display:flex;gap:15px;align-items:flex-start;
  padding:12px 14px;border-radius:10px;text-decoration:none;
  border:1px solid oklch(0.28 0.012 62);
  background:oklch(0.205 0.012 62);
  transition:border-color .24s ease,background .24s ease,transform .24s var(--ease);
}
.bk:hover{border-color:oklch(0.5 0.02 66);background:oklch(0.232 0.014 62);transform:translateY(-2px)}
.bk:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.bk.is-current{
  border-color:oklch(0.7 0.06 72);background:oklch(0.245 0.016 64);
  box-shadow:0 0 0 1px oklch(0.7 0.06 72 / .35) inset;
}
.bk-cover{
  position:relative;flex:none;width:82px;aspect-ratio:3/4.16;
  border-radius:3px;overflow:hidden;background:oklch(0.3 0.02 62);
  box-shadow:0 5px 14px rgba(0,0,0,.45);
}
.bk-cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.bk-cover .ph{
  position:absolute;inset:0;display:grid;place-items:center;padding:6px;
  font-size:9.5px;line-height:1.35;text-align:center;color:oklch(0.86 0.02 70);
  background:linear-gradient(160deg,oklch(0.34 0.03 62),oklch(0.24 0.03 62));
}
.bk-tx{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}
.bk-t{
  font-family:var(--font-display);font-weight:700;font-size:15.5px;line-height:1.4;
  color:oklch(0.94 0.012 78);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bk-a{font-size:11.5px;color:oklch(0.62 0.014 66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-w{
  margin-top:2px;font-size:12.2px;line-height:1.7;color:oklch(0.73 0.018 66);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bk-meta{display:flex;align-items:center;gap:9px;margin-top:7px}
.bk-bar{flex:0 1 104px;min-width:0;height:2px;background:oklch(0.3 0.012 62);border-radius:2px;overflow:hidden}
.bk-bar i{display:block;height:100%;background:oklch(0.66 0.06 72)}
.bk-pg{font-family:var(--font-latin);font-size:10px;color:oklch(0.6 0.014 66);white-space:nowrap}
.bk-go{font-family:var(--font-latin);font-size:10.5px;color:oklch(0.74 0.05 72);white-space:nowrap}

.cur-tip{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font-size:10px;letter-spacing:.06em;background:oklch(0.62 0.08 72);color:oklch(0.16 0.02 60);
  vertical-align:middle;
}

@media (max-width:430px){
  .bk-cover{width:62px}
  .bk-t{font-size:13.5px}
  .bk-w{-webkit-line-clamp:3}
  .stats{gap:15px}
  .stage-head{gap:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" id="back">← 书卡频道</a>
    <div class="topmark" id="mark">The Reading Edit</div>
  </div>
  <div id="app"><div class="loading">LOADING…</div></div>
</div>

<script>
(function(){
  "use strict";
  var app=document.getElementById("app");
  var qs=new URLSearchParams(location.search);
  var pid=qs.get("id")||"";
  var focus=qs.get("book")||"";

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function err(msg){
    app.innerHTML='<div class="errbox">书单没找到。<br>'+esc(msg)+
      '<br><br><a style="color:#e8d8bc" href="index.html">回书卡频道</a></div>';
  }

  // 从频道页点进来时优先退回上一步，位置和当前那张卡都能保住
  document.getElementById("back").addEventListener("click",function(e){
    if(history.length>1&&document.referrer){ e.preventDefault(); history.back(); }
  });

  fetch("cards.json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      var paths=d.paths||[], cards=d.cards||[];
      var bySlug={};
      cards.forEach(function(c){ bySlug[c.slug]=c; });
      var p=paths.filter(function(x){ return x.id===pid; })[0];
      if(!p){ err("没有 id=" + pid); return; }
      document.title=p.title+" · 书单详情";
      render(p,bySlug,cards);
    })
    .catch(function(e){
      err(e.message);
    });

  function render(p,bySlug,cards){
    document.getElementById("mark").innerHTML='<b>'+esc(p.field)+'</b> · '+esc(p.level);

    var total=p.n, read=0, doing=0;
    (p.stages||[]).forEach(function(st){
      st.slugs.forEach(function(s){
        var c=bySlug[s];
        if(!c) return;
        if(c.fin||c.prog>=95) read++;
        else if(c.prog>0) doing++;
      });
    });

    var html=''+
      '<div class="hero">'+
        '<div class="row">'+
          '<span class="chip">'+esc(p.field)+'</span>'+
          '<span class="chip">'+esc(p.level)+'</span>'+
          '<span class="chip">'+(p.stages||[]).length+' 个阶段</span>'+
        '</div>'+
        '<h1>'+esc(p.title)+'</h1>'+
        '<p class="goal">'+esc(p.goal)+'</p>'+
        '<div class="stats">'+
          '<span><i>'+total+'</i>本</span>'+
          '<span><i>'+read+'</i>已读</span>'+
          (doing?'<span><i>'+doing+'</i>在读</span>':'')+
          '<span><i>'+Math.max(0,total-read-doing)+'</i>未开卷</span>'+
        '</div>'+
      '</div>';

    (p.stages||[]).forEach(function(st,si){
      html+='<section class="stage">'+
        '<div class="stage-head">'+
          '<div class="stage-no">'+String(si+1).padStart(2,"0")+'</div>'+
          '<div><h2>'+esc(st.name)+'</h2>'+
            (st.aim?'<p class="stage-aim">'+esc(st.aim)+'</p>':'')+
          '</div>'+
        '</div>'+
        (st.tip?'<div class="stage-tip">读法 · '+esc(st.tip)+'</div>':'')+
        '<ul class="books">';

      st.slugs.forEach(function(slug){
        var c=bySlug[slug];
        if(!c) return;
        var isCur=(slug===focus);
        var progTxt=c.fin?"已读毕":(c.prog>0?c.prog+"%":"未开卷");
        html+='<a class="bk'+(isCur?" is-current":"")+'" href="book.html?slug='+encodeURIComponent(slug)+'">'+
          '<div class="bk-cover">'+
            '<div class="ph">'+esc(c.t)+'</div>'+
            '<img src="'+esc(c.cover)+'" alt="'+esc(c.t)+' 封面" loading="lazy" decoding="async" onerror="this.style.display=&#39;none&#39;">'+
          '</div>'+
          '<div class="bk-tx">'+
            '<div class="bk-t">'+esc(c.t)+(isCur?'<span class="cur-tip">当前</span>':'')+'</div>'+
            '<div class="bk-a">'+esc(c.a||"")+'</div>'+
            '<div class="bk-w">'+esc(c.w||"")+'</div>'+
            '<div class="bk-meta">'+
              '<div class="bk-bar"><i style="width:'+Math.max(2,c.prog||0)+'%"></i></div>'+
              '<span class="bk-pg">'+progTxt+'</span>'+
              '<span class="bk-go">书卡 →</span>'+
            '</div>'+
          '</div>'+
        '</a>';
      });
      html+='</ul></section>';
    });

    var last=(p.stages||[]).length?p.stages[p.stages.length-1].slugs[0]:"";
    html+='<div class="footnav">'+
      '<a class="btn btn-primary" href="index.html">回书卡频道</a>'+
      (last?'<a class="btn btn-ghost" href="../reading-notes/books/'+encodeURIComponent(last)+'/combined.html">直接读第一本</a>':'')+
      '</div>';

    app.innerHTML=html;
    app.querySelectorAll(".bk-cover img").forEach(function(im){
      im.addEventListener("load",function(){ im.parentNode.classList.add("ok"); });
    });
  }
})();
</script>
</body>
</html>
