<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 跟随首页 Aa 主题 */
try{var _c=JSON.parse(localStorage.getItem('rd-cfg')||'{}');document.documentElement.dataset.theme=_c.theme||'cream';}catch(e){document.documentElement.dataset.theme='cream';}
</script>
<title>书单详情 · 书卡频道</title>
<link rel="stylesheet" href="app.css">
<style>
/* ============================================================
   书单详情 · 版式规范
   ------------------------------------------------------------
   容器 1040：比画廊 1120 略收，因为这里是阅读型页面
   栅格 3 列 —— 数据里 15 个阶段正好 3 本，3 列一排就齐；2 列会排成
        2+1 右边空半块，4 列又让 3 本的那排空一列
   字号 36 / 20 / 14.5 / 12 / 11 —— 五档，与书卡详情同源
   ============================================================ */

.wrap{max-width:1040px}

/* ============ 封面区 ============ */
.hero{padding:clamp(8px,1.6vh,18px) 0 clamp(20px,3.2vh,32px);border-bottom:1px solid oklch(0.28 0.013 62)}
.hero .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(23px,3.2vw,36px);line-height:1.3;letter-spacing:.015em;
  text-wrap:balance;
}
.hero .goal{
  margin-top:14px;max-width:66ch;
  font-size:14px;line-height:1.95;color:oklch(0.74 0.016 68);text-wrap:pretty;
}
.stats{display:flex;gap:0;margin-top:22px;flex-wrap:wrap}
.stats span{
  padding-right:24px;margin-right:24px;border-right:1px solid oklch(0.29 0.013 62);
  font-size:11px;letter-spacing:.1em;color:oklch(0.56 0.014 66);
  display:inline-flex;align-items:center;gap:7px;
}
.stats span:last-child{border-right:0;margin-right:0;padding-right:0}
.stats i{
  font-family:var(--font-latin);font-style:normal;
  font-size:22px;line-height:1;color:oklch(0.94 0.012 80);letter-spacing:0;
  position:relative;top:-1px;
}
/* 浅色主题：数字与分隔线换成深墨，别让浅字压在米白底上 */
html:not([data-theme="dark"]) .stats i{color:#24312e}
html:not([data-theme="dark"]) .stats span{border-right-color:#e0dacd;color:#5b6a63}
/* ===== 浅色主题：书卡从深色书脊换成纸白，与首页 Aa 一致 ===== */
html:not([data-theme="dark"]) .bk{border-color:#e5e0d6;background:#fffefa}
html:not([data-theme="dark"]) .bk:hover{border-color:#cdc5b6;background:#fff}
html:not([data-theme="dark"]) .bk.is-current{border-color:#bf8247;background:#fffaf0;box-shadow:inset 0 0 0 1px rgba(191,130,71,.25)}
html:not([data-theme="dark"]) .bk-t{color:#24312e}
html:not([data-theme="dark"]) .bk-a{color:#6b756f}
html:not([data-theme="dark"]) .bk-w{color:#4c5a54}
html:not([data-theme="dark"]) .bk-bar{background:#e7e2d6}
html:not([data-theme="dark"]) .bk-pg{color:#6b756f}
html:not([data-theme="dark"]) .stage-tip{background:#efe9df;color:#4c5a54}
html:not([data-theme="dark"]) .stage-tip b{color:#24312e}
html:not([data-theme="dark"]) .stage-aim{color:#4c5a54}
html:not([data-theme="dark"]) .bk:focus-visible{outline-color:#24312e}
/* 夜间：书卡底色也换成首页 --card 的冷灰，别在纯黑底上留一块暖褐 */
html[data-theme="dark"] .bk{background:#1f2226;border-color:#34383f}
html[data-theme="dark"] .bk:hover{background:#24282d;border-color:#4a5058}

/* ============ 阶段 ============ */
.stage{padding:clamp(26px,4vh,40px) 0 0}
.stage-head{display:flex;gap:16px;align-items:flex-start;padding-bottom:8px}
.stage-no{
  flex:none;font-family:var(--font-latin);font-size:clamp(26px,3vw,34px);
  line-height:.9;color:oklch(0.42 0.022 62);letter-spacing:-.02em;
}
.stage-head h2{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(16px,1.9vw,20px);line-height:1.42;letter-spacing:.03em;
}
.stage-aim{margin-top:6px;font-size:13px;line-height:1.72;color:oklch(0.68 0.016 66)}
.stage-tip{
  margin:12px 0 0;padding:10px 14px;border-left:2px solid oklch(0.6 0.06 70);
  background:oklch(0.235 0.014 62);border-radius:0 3px 3px 0;
  font-size:12.5px;line-height:1.8;color:oklch(0.74 0.016 66);
}
.stage-tip b{color:oklch(0.86 0.02 72);font-weight:400}

/* ============ 三列书卡 ============ */
.books{
  display:grid;gap:10px;margin-top:14px;list-style:none;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:stretch;
}
@media (max-width:900px){ .books{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .books{grid-template-columns:1fr} }

.bk{
  display:flex;gap:13px;align-items:flex-start;
  padding:11px 13px;border-radius:8px;text-decoration:none;
  border:1px solid oklch(0.275 0.012 62);
  background:oklch(0.202 0.012 62);
  transition:border-color .24s ease,background .24s ease,transform .24s var(--ease);
}
.bk:hover{border-color:oklch(0.5 0.02 66);background:oklch(0.228 0.014 62);transform:translateY(-2px)}
.bk:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.bk.is-current{
  border-color:oklch(0.66 0.06 72);
  background:oklch(0.245 0.016 64);
  box-shadow:inset 0 0 0 1px oklch(0.66 0.06 72 / .3);
}
.bk-cover{
  position:relative;flex:none;width:74px;aspect-ratio:3/4.16;
  border-radius:3px;overflow:hidden;background:oklch(0.3 0.02 62);
  box-shadow:0 5px 14px rgba(0,0,0,.45);
}
.bk-cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.bk-cover .ph{
  position:absolute;inset:0;display:grid;place-items:center;padding:5px;
  font-size:9px;line-height:1.35;text-align:center;color:oklch(0.86 0.02 70);
  background:linear-gradient(160deg,oklch(0.34 0.03 62),oklch(0.24 0.03 62));
}
.bk-tx{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}
.bk-t{
  font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.4;
  color:oklch(0.94 0.012 78);min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bk-a{
  margin-top:2px;font-size:11px;line-height:1.45;min-height:1.45em;
  color:oklch(0.58 0.013 66);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bk-w{
  margin-top:7px;font-size:12px;line-height:1.68;color:oklch(0.72 0.016 66);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bk-meta{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px}
.bk-bar{flex:1;min-width:0;height:2px;background:oklch(0.3 0.012 62);border-radius:2px;overflow:hidden}
.bk-bar i{display:block;height:100%;background:oklch(0.66 0.06 72)}
.bk-pg{
  flex:none;font-family:var(--font-latin);font-size:10px;letter-spacing:.04em;
  color:oklch(0.6 0.014 66);white-space:nowrap;
}

.cur-tip{
  display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;
  font-family:var(--font-body);font-weight:400;
  font-size:9.5px;letter-spacing:.06em;
  background:oklch(0.6 0.08 72);color:oklch(0.16 0.02 60);
  vertical-align:2px;
}

@media (max-width:560px){
  /* 单列时一行就是整屏宽，封面不放大卡片会显得空 */
  .bk{gap:15px;padding:13px 14px}
  .bk-cover{width:84px}
  .bk-t{font-size:15px}
  .bk-a{font-size:11.5px}
  .bk-w{font-size:12.5px;-webkit-line-clamp:3}
  .stats span{padding-right:16px;margin-right:16px}
  .stage-head{gap:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" id="back">← 书卡频道</a>
    <div class="topmark" id="mark">The Reading Edit</div>
  </div>
  <div id="app"><div class="loading">LOADING…</div></div>
</div>

<script>
(function(){
  "use strict";
  var app=document.getElementById("app");
  var qs=new URLSearchParams(location.search);
  var pid=qs.get("id")||"";
  var focus=qs.get("book")||"";

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function shortName(a){
    a=String(a||"").replace(/^\s*\[[^\]]*\]\s*/,"").trim();
    var parts=a.split(/\s+(?=\[)/).filter(Boolean);
    return parts.length>2?parts.slice(0,2).join(" ")+" 等":a;
  }
  function err(msg){
    app.innerHTML='<div class="errbox">书单没找到。<br>'+esc(msg)+
      '<br><br><a style="color:#e8d8bc" href="index.html">回书卡频道</a></div>';
  }

  // 从频道页点进来时优先退回上一步，位置和当前那张卡都能保住
  document.getElementById("back").addEventListener("click",function(e){
    if(history.length>1&&document.referrer){ e.preventDefault(); history.back(); }
  });

  fetch("cards.json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      var paths=d.paths||[], cards=d.cards||[];
      var bySlug={};
      cards.forEach(function(c){ bySlug[c.slug]=c; });
      var p=paths.filter(function(x){ return x.id===pid; })[0];
      if(!p){ err("没有 id=" + pid); return; }
      document.title=p.title+" · 书单详情";
      render(p,bySlug,cards);
    })
    .catch(function(e){ err(e.message); });

  function render(p,bySlug,cards){
    document.getElementById("mark").innerHTML='<b>'+esc(p.field)+'</b> · '+esc(p.level);

    var total=p.n, read=0, doing=0;
    (p.stages||[]).forEach(function(st){
      st.slugs.forEach(function(s){
        var c=bySlug[s];
        if(!c) return;
        if(c.fin||c.prog>=95) read++;
        else if(c.prog>0) doing++;
      });
    });

    var html=''+
      '<div class="hero">'+
        '<div class="row">'+
          '<span class="chip">'+esc(p.field)+'</span>'+
          '<span class="chip">'+esc(p.level)+'</span>'+
          '<span class="chip">'+(p.stages||[]).length+' 个阶段</span>'+
        '</div>'+
        '<h1>'+esc(p.title)+'</h1>'+
        '<p class="goal">'+esc(p.goal)+'</p>'+
        '<div class="stats">'+
          '<span><i>'+total+'</i>本</span>'+
          '<span><i>'+read+'</i>已读</span>'+
          (doing?'<span><i>'+doing+'</i>在读</span>':'')+
          '<span><i>'+Math.max(0,total-read-doing)+'</i>未开卷</span>'+
        '</div>'+
      '</div>';

    (p.stages||[]).forEach(function(st,si){
      html+='<section class="stage">'+
        '<div class="stage-head">'+
          '<div class="stage-no">'+String(si+1).padStart(2,"0")+'</div>'+
          '<div><h2>'+esc(st.name)+'</h2>'+
            (st.aim?'<p class="stage-aim">'+esc(st.aim)+'</p>':'')+
          '</div>'+
        '</div>'+
        (st.tip?'<div class="stage-tip"><b>读法</b> · '+esc(st.tip)+'</div>':'')+
        '<ul class="books">';

      st.slugs.forEach(function(slug){
        var c=bySlug[slug];
        if(!c) return;
        var isCur=(slug===focus);
        var progTxt=c.fin?"已读毕":(c.prog>0?c.prog+"%":"未开卷");
        html+='<a class="bk'+(isCur?" is-current":"")+'" href="book.html?slug='+encodeURIComponent(slug)+'">'+
          '<div class="bk-cover">'+
            '<div class="ph">'+esc(c.t)+'</div>'+
            '<img src="'+esc(c.cover)+'" alt="'+esc(c.t)+' 封面" loading="lazy" decoding="async" onerror="this.style.display=&#39;none&#39;">'+
          '</div>'+
          '<div class="bk-tx">'+
            '<div class="bk-t">'+esc(c.t)+(isCur?'<span class="cur-tip">当前</span>':'')+'</div>'+
            '<div class="bk-a">'+esc(shortName(c.a))+'</div>'+
            '<div class="bk-w">'+esc(c.w||"")+'</div>'+
            '<div class="bk-meta">'+
              '<div class="bk-bar"><i style="width:'+(c.prog>0?Math.max(3,c.prog):0)+'%"></i></div>'+
              '<span class="bk-pg">'+progTxt+'</span>'+
            '</div>'+
          '</div>'+
        '</a>';
      });
      html+='</ul></section>';
    });

    var last=(p.stages||[]).length?p.stages[p.stages.length-1].slugs[0]:"";
    html+='<div class="footnav">'+
      '<a class="btn btn-primary" href="index.html">回书卡频道</a>'+
      (last?'<a class="btn btn-ghost" href="../reading-notes/books/'+encodeURIComponent(last)+'/combined.html">直接读第一本</a>':'')+
      '</div>';

    app.innerHTML=html;

    // 带 book 参数进来时把当前这本滚到视野里（只滚窗口，不影响别的）
    var cur=app.querySelector(".bk.is-current");
    if(cur&&cur.scrollIntoView){
      var y=cur.getBoundingClientRect().top+window.pageYOffset-140;
      window.scrollTo(0,y);
    }
  }
})();
</script>
</body>
</html>
