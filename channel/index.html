<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书卡频道 · 美学书单</title>
<meta name="description" content="17 条主题书单、166 本书。一条书单一张卡，封面在上、三步在下，一屏看一步，任意一本都能点进全书领读。">
<style>
/* ============ Design Tokens ============ */
:root{
  --font-display:"Noto Serif CJK SC","Songti SC","STSong",serif;
  --font-body:"Noto Serif CJK SC","Songti SC",serif;
  --font-latin:Georgia,"Times New Roman",serif;

  /* 暖黑画廊背景，避纯黑 */
  --bg:oklch(0.165 0.014 62);
  --bg-deep:oklch(0.135 0.012 60);

  /* 纸质卡片，避纯白 */
  --paper:oklch(0.958 0.013 82);
  --paper-2:oklch(0.925 0.016 78);
  --ink:oklch(0.30 0.022 58);
  --ink-soft:oklch(0.50 0.018 62);
  --ink-faint:oklch(0.66 0.014 70);
  --line:oklch(0.87 0.018 74);

  /* 每张卡的主色由封面主色相注入 */
  --accent:oklch(0.58 0.105 60);
  --accent-soft:oklch(0.90 0.035 70);

  --card-w:min(clamp(320px,34vw,620px),calc(78vh / 1.66));
  --card-h:calc(var(--card-w) * 1.66);
  --card-w:min(clamp(320px,34vw,620px),calc(78svh / 1.66));
  --card-h:calc(var(--card-w) * 1.66);
  --gap:clamp(2px,0.6vw,10px);

  --ease:cubic-bezier(.22,1,.36,1);
}

/* 返回书单Tab：桌面在刊头，手机浮在左上角 */
.backpill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-family:var(--font-latin);font-size:12.5px;letter-spacing:.04em;
  color:var(--paper);text-decoration:none;
  border:1px solid oklch(0.55 0.02 62 /.45);border-radius:999px;padding:6px 13px 6px 10px;
  transition:background .25s ease,border-color .25s ease,transform .25s var(--ease);
  white-space:nowrap;
}
.backpill:hover{background:oklch(0.9 0.02 80 /.12);border-color:var(--paper);transform:translateX(-2px)}
.backpill:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.m-back{
  position:absolute;top:10px;left:10px;z-index:40;display:none;
  font-size:12px;padding:5px 11px 5px 8px;
  background:oklch(0.19 0.016 62 /.72);backdrop-filter:blur(6px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;width:100%;
  background:var(--bg);
  color:var(--paper);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  touch-action:pan-x;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,oklch(0.26 0.022 66) 0%,oklch(0.19 0.016 62) 42%,var(--bg-deep) 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/></svg>");
}

.app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ============ Masthead ============ */
/* 页头页脚都浮在画面上：它们占高度，卡片就永远长不到满屏 */
.masthead{
  position:absolute;top:0;left:0;right:0;z-index:30;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:clamp(12px,2vh,22px) clamp(20px,4vw,56px) 0;
  gap:12px;pointer-events:none;
}
.masthead>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .mark{
  font-family:var(--font-latin);font-style:italic;font-size:clamp(20px,2.1vw,27px);
  letter-spacing:.02em;color:var(--paper);white-space:nowrap;
}
.brand .cn{font-size:clamp(11px,1.05vw,14px);letter-spacing:.22em;color:var(--ink-faint);white-space:nowrap}
.mast-num{display:flex;align-items:center;gap:14px;font-family:var(--font-latin)}
.mast-num .cur{font-size:clamp(19px,1.8vw,24px);letter-spacing:.06em}
.mast-num .sep{width:clamp(46px,6vw,84px);height:1px;background:var(--ink-faint);opacity:.5;position:relative}
.mast-num .sep i{position:absolute;left:0;top:-1px;height:3px;background:var(--paper);transition:left .62s var(--ease),width .62s var(--ease)}
.mast-num .tot{font-size:clamp(13px,1.2vw,16px);color:var(--ink-faint)}
.mast-seas{
  display:none;   /* 与卡内书单名重复，还和右上角的播放键抢位置 */
  justify-self:end;font-family:var(--font-latin);font-style:italic;
  font-size:clamp(11px,1.05vw,14px);letter-spacing:.06em;color:var(--ink-faint);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
.mast-seas b{font-style:normal;font-weight:400;color:oklch(0.78 0.02 70)}

/* ============ Gallery ============ */
.gallery{position:relative;flex:1;min-height:0;perspective:1700px}

.card{
  position:absolute;top:50%;left:50%;
  width:var(--card-w);height:var(--card-h);
  margin-left:calc(var(--card-w)/-2);
  margin-top:calc(var(--card-h)/-2);
  border-radius:5px;
  transform-style:preserve-3d;
  /* 相邻卡退到主卡身后只露一条边：三张并排时哪张都显小，一张独占才立得住 */
  transform:translateX(calc(var(--rel,0) * var(--card-w) * .56)) scale(var(--sc,1)) rotateY(var(--ry,0deg));
  transition:transform .6s var(--ease),opacity .42s ease,visibility .42s;
  cursor:pointer;outline:none;
  contain:layout style;
}
/* 用遮罩代替 filter：filter 过渡要逐帧重绘整棵子树，移动端必卡 */
.card::after{
  content:"";position:absolute;inset:0;z-index:9;border-radius:5px;
  background:#0e0b08;opacity:0;pointer-events:none;
  transition:opacity .42s ease;
}
.card.is-near::after{opacity:.5}
.card.is-side::after{opacity:.5}
.card.is-far{visibility:hidden;opacity:0;pointer-events:none;content-visibility:hidden}
.card.is-side{pointer-events:none}
.card:focus-visible .paper{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent-soft),0 30px 70px rgba(0,0,0,.5)}
/* 只有中间那张画模糊底色：5 张同时 blur 是移动端最大的掉帧来源 */
.card:not(.is-active) .stage-bg{display:none}
.card:not(.is-active) .stage-num{display:none}
.card.is-active .stage-bg{animation:bgIn .5s ease both}
@keyframes bgIn{from{opacity:0}to{opacity:1}}

.paper{
  position:relative;width:100%;height:100%;
  background:var(--paper);color:var(--ink);
  border-radius:5px;overflow:hidden;
  container-type:inline-size;
  box-shadow:0 26px 60px rgba(0,0,0,.46),0 3px 10px rgba(0,0,0,.3);
  display:flex;flex-direction:column;
}
.spine{position:absolute;left:0;top:0;bottom:0;width:1.2cqw;background:var(--accent);z-index:3}

/* 卡内刊头 */
.card-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:3.4cqw 5cqw 2.4cqw;
}
.issue{font-family:var(--font-latin);font-size:max(2.9cqw,9.5px);letter-spacing:.18em;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.issue b{color:var(--accent);font-weight:400}

/* ============ 封面舞台：模糊底 + 清晰书封 ============ */
.stage{
  position:relative;flex:1 1 auto;min-height:34%;overflow:hidden;
  /* 纯色底按封面主色相铺，非活动卡不画模糊图也有统一色调 */
  background:oklch(0.81 0.032 var(--h,60));
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:2.2cqw;
}
.stage-bg{
  position:absolute;inset:-14%;background-size:cover;background-position:center;
  filter:blur(24px) saturate(1.55) brightness(.72);transform:scale(1.12);
}
/* 书封底色千差万别，浅色封面上白字会糊：底部压一层渐隐黑，跟封面无关 */
.stage::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:46%;z-index:1;
  background:linear-gradient(to top,rgba(14,10,7,.92) 0%,rgba(14,10,7,.6) 34%,rgba(14,10,7,.12) 62%,rgba(14,10,7,0) 100%);
  pointer-events:none;
}
.stage-tint{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(18,14,10,.3) 0%,rgba(18,14,10,.08) 42%,rgba(16,12,8,.62) 100%);
}
.stage-wash{position:absolute;inset:0;background:linear-gradient(118deg,var(--accent-soft) 0%,transparent 58%);opacity:.22;mix-blend-mode:screen}
.cover-wrap{
  /* 高度按「舞台高 - 书名区」算，不按百分比：卡宽一变大，百分比算出来的封面
     就会长到书名底下，宽屏上几乎贴字 */
  display:block;position:relative;z-index:2;
  height:calc(100% - 27cqw);max-height:88%;width:auto;aspect-ratio:3/4.16;
  border-radius:2px;overflow:hidden;
  box-shadow:0 18px 34px rgba(0,0,0,.6),0 3px 9px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.3);
  transform:rotate(-1.4deg);
  background:oklch(0.86 0.02 76);
}
.cover-wrap img{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:block}
.cover-ph{
  position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:8%;
  background:linear-gradient(160deg,oklch(0.87 0.032 var(--h,60)),oklch(0.74 0.055 var(--h,60)));
  color:oklch(0.28 0.03 60);font-family:var(--font-display);font-weight:700;
  font-size:4.2cqw;line-height:1.34;letter-spacing:.04em;text-align:center;
}
.cover-wrap.has-img .cover-ph{display:none}

/* 篇幅标记放在刊头右侧：书单名最长 7 字，压图时会被它挤到换行 */
.hd-count{
  flex:none;font-family:var(--font-latin);font-size:max(2.6cqw,9px);letter-spacing:.12em;
  color:var(--ink-faint);white-space:nowrap;
}
.stage-num{
  position:absolute;left:4.4cqw;bottom:3cqw;
  font-family:var(--font-latin);font-size:11cqw;line-height:.86;
  color:#f8f0e2;opacity:.2;letter-spacing:-.02em;
}

/* ============ 书名区 ============ */
.titleblock{flex:0 0 auto;padding:3.4cqw 5cqw 0}
.titleblock h3{
  font-family:var(--font-display);font-weight:700;
  font-size:6.2cqw;line-height:1.22;letter-spacing:.02em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.titleblock .by{
  margin-top:1.5cqw;font-size:max(2.55cqw,9.5px);letter-spacing:.04em;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82;
}
.titleblock .by::before{content:"— ";color:var(--accent)}
.titleblock .by.is-empty{display:none}

/* ============ 荐语 ============ */
.why{flex:0 0 auto;padding:2.6cqw 5cqw 0}
.why .label{
  font-family:var(--font-latin);font-style:italic;font-size:max(2.15cqw,9px);
  letter-spacing:.1em;color:var(--accent);margin-bottom:.9cqw;
}
.why p{
  font-size:2.8cqw;line-height:1.78;color:var(--ink-soft);text-align:justify;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

/* ============ 关联阅读：横向轨道 ============ */
.more{
  flex:1 1 0;min-height:0;margin:2.6cqw 0 0;padding:2.2cqw 0 1.4cqw;
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;
}
.more .cap{
  padding:0 5cqw;
  font-size:max(2.2cqw,9px);letter-spacing:.12em;color:var(--ink-faint);
  display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;
}
.more .cap em{
  font-family:var(--font-latin);font-style:normal;
  font-size:max(1.95cqw,8.5px);color:var(--accent);flex:none;letter-spacing:.04em;
}

/* 轨道高度跟着卡内剩余空间走，封面再按高度反推宽度：
   卡高一点封面就大一点，不会像固定宽度那样在下方留一大块空 */
.more .row{
  flex:1 1 auto;min-height:0;
  display:flex;align-items:stretch;gap:1.7cqw;
  margin-top:1.5cqw;padding:1px 5cqw 2px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;
  scroll-padding-inline:5cqw;
  overscroll-behavior-x:contain;
  touch-action:pan-x;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  cursor:grab;
}
.more .row::-webkit-scrollbar{display:none}
.more .row.is-drag{cursor:grabbing;scroll-snap-type:none}
.more .mini{
  flex:0 0 auto;width:18.5cqw;
  display:flex;flex-direction:column;text-decoration:none;border-radius:2px;
  scroll-snap-align:start;
  transition:transform .2s var(--ease);
}
.more .mini:hover{transform:translateY(-2px)}
.more .mini:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.more .mini .th{
  position:relative;width:100%;aspect-ratio:3/4.16;
  border-radius:2px;overflow:hidden;
  background:oklch(0.88 0.015 78);
  box-shadow:0 2px 6px rgba(0,0,0,.16);
}
.more .mini .th img{width:100%;height:100%;object-fit:cover;display:block}
/* 关联标签：直接说明「为什么推这本」，别让人以为随机塞的 */
.more .mini .tg{
  position:absolute;left:0;top:0;
  font-size:max(1.55cqw,7px);line-height:1;letter-spacing:.02em;
  padding:.65cqw .9cqw;border-radius:0 0 3px 0;
  color:oklch(0.95 0.006 82);background:oklch(0.22 0.012 62 / .62);
}
.more .mini .tg.is-author{background:oklch(0.44 0.11 44 / .86)}
.more .mini .tg.is-step{background:oklch(0.38 0.07 150 / .82)}
.more .mini .nm{
  flex:0 0 auto;width:100%;
  margin-top:.7cqw;font-size:max(1.95cqw,8.5px);line-height:1.34;
  color:var(--ink-soft);opacity:.9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ============ 书单卡：上大图、下分步 ============ */
/* 书单名压在封面图下沿：整张卡的视觉重心是这张图，不是一排文字 */
.stage-title{
  position:absolute;left:5cqw;right:5cqw;bottom:3.2cqw;z-index:3;pointer-events:none;
}
.stage-title h3{
  font-family:var(--font-display);font-weight:700;
  font-size:9.4cqw;line-height:1.08;letter-spacing:.02em;color:#fdf6ea;
  text-shadow:0 2px 18px rgba(0,0,0,.7),0 1px 4px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.stage-title .s{
  margin-top:1.2cqw;font-size:2.9cqw;letter-spacing:.06em;color:rgba(253,246,234,.82);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}

/* 三步切换：一屏看一步，阶段名 / 目标 / 读法建议都能写全 */
.tabs{flex:0 0 auto;display:flex;gap:1.4cqw;padding:2.8cqw 5cqw 0}
.tab{
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:.9cqw;
  padding:1.7cqw 1cqw;border-radius:2px;cursor:pointer;
  border:1px solid var(--line);background:transparent;
  font-family:inherit;font-size:max(2.6cqw,10.5px);color:var(--ink-soft);
  transition:background .22s ease,color .22s ease,border-color .22s ease;
}
.tab i{font-family:var(--font-latin);font-style:normal;font-size:2.5cqw;color:var(--accent);flex:none}
.tab span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab em{font-family:var(--font-latin);font-style:normal;font-size:2cqw;color:var(--ink-faint);flex:none}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab.on i{color:var(--accent-soft)}
.tab.on em{color:oklch(0.82 0.008 80)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 高度写死：切步骤时「目标」长短不一，不固定的话封面会上下跳 */
.sinfo{flex:0 0 auto;height:17cqw;overflow:hidden;padding:2.4cqw 5cqw 0}
.sinfo .nm{
  font-size:2.95cqw;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sinfo .aim{
  margin-top:.8cqw;font-size:2.55cqw;line-height:1.52;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sinfo .tip{
  position:relative;margin-top:1.1cqw;padding-left:2.8cqw;
  font-size:2.4cqw;line-height:1.5;color:var(--accent);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sinfo .tip::before{content:"↳";position:absolute;left:0;top:0;opacity:.72}
.sinfo .tip.is-empty{display:none}

.books{
  flex:0 0 auto;
  display:flex;align-items:flex-start;gap:1.7cqw;
  padding:2.6cqw 5cqw 1.2cqw;
  overflow-x:auto;overflow-y:hidden;
  overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.books::-webkit-scrollbar{display:none}
.sb{flex:0 0 auto;width:21.2cqw;text-decoration:none}
.sb .th{
  position:relative;width:100%;height:29.4cqw;
  border-radius:2px;overflow:hidden;
  background:oklch(0.87 0.03 var(--h,60));
  box-shadow:0 2px 5px rgba(0,0,0,.16);
  transition:transform .2s var(--ease);
}
.sb .th img{width:100%;height:100%;object-fit:cover;display:block}
.sb:hover .th{transform:translateY(-2px)}
.sb .bd{
  position:absolute;right:0;top:0;
  font-family:var(--font-latin);font-size:max(1.75cqw,7.5px);letter-spacing:.04em;
  color:#fdf6ea;background:oklch(0.3 0.04 60 /.78);
  padding:.35cqw .8cqw;border-radius:0 0 0 2px;
}
/* 一阶段不足 4 本时，空出来的那格放「进入下一步」，既不空也不抢戏 */
.sb-next{flex:1 1 0;width:auto;min-width:0;background:none;border:none;padding:0;font-family:inherit;cursor:pointer;text-align:center}
.sb-next .th{
  height:29.4cqw;border:1px dashed oklch(0.74 0.02 70);background:transparent;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1cqw;
  color:var(--ink-faint);
  transition:border-color .22s ease,background .22s ease;
}
.sb-next .th::before{content:"↳";font-size:5.2cqw;line-height:1;color:var(--accent);opacity:.62}
.sb-next .tx{font-size:2.1cqw;line-height:1.42;padding:0 1.2cqw;max-height:2.84em;overflow:hidden}
.sb-next .nm{color:var(--accent);opacity:1}
.sb-next:hover .th{border-color:var(--accent);background:oklch(0.955 0.012 80)}
.sb-next:focus-visible .th{outline:2px solid var(--accent);outline-offset:2px}

.sb .nm{
  margin-top:.6cqw;font-size:2.15cqw;line-height:1.36;color:var(--ink-soft);
  height:1.36em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.sb:hover .nm{color:var(--accent)}
.sb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ 卡底 ============ */
.foot{
  flex:0 0 auto;margin:0 5cqw;padding:3cqw 0 3.6cqw;
  display:flex;align-items:center;justify-content:space-between;gap:2.4cqw;
}
.bar{flex:1;min-width:0}
.bar .track{height:2px;background:var(--line);position:relative;border-radius:2px;overflow:hidden}
.bar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .leg{display:flex;justify-content:space-between;gap:1.4cqw;margin-top:2.2cqw;font-size:max(2cqw,8.5px);color:var(--ink-faint);letter-spacing:.03em}
.bar .leg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{
  flex:none;font-family:var(--font-latin);font-size:2.4cqw;letter-spacing:.05em;
  color:var(--paper);background:var(--accent);text-decoration:none;
  padding:1.6cqw 2.4cqw;border-radius:2px;white-space:nowrap;
  transition:filter .25s ease,transform .25s var(--ease);
}
.go:hover{filter:brightness(1.12);transform:translateY(-1px)}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 非活动卡不响应链接：点侧卡是「切到这张」，不是「跳走」 */
.card:not(.is-active) .go,
.card:not(.is-active) .cover-wrap{pointer-events:none}

/* ============ 自动轮播进度：贴画廊底边，不占布局高度 ============ */
.dotwrap{display:flex;flex-direction:column;align-items:center;gap:5px;max-width:min(92vw,760px)}
.autobar{
  position:relative;display:block;
  width:100%;height:2px;border:none;padding:0;border-radius:2px;flex:none;
  background:oklch(0.55 0.02 62 /.18);overflow:visible;cursor:pointer;
  opacity:0;transition:opacity .4s ease;
}
/* 2px 的线不好点，往上下一共撑出 28px 的热区，但看不见 */
.autobar::before{content:"";position:absolute;left:-18px;right:-18px;top:-13px;bottom:-13px}
.autobar:focus-visible{outline:1px solid var(--paper);outline-offset:6px}
.autobar.is-run,.autobar.is-paused{opacity:1}
.autobar i{
  display:block;width:100%;height:100%;background:var(--paper);opacity:.9;
  transform:scaleX(0);transform-origin:left center;
}
.autobar.is-run i{animation:autoFill var(--auto-ms,8000ms) linear forwards}
.autobar.is-paused i{animation-play-state:paused}
@keyframes autoFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ============ Controls ============ */
/* 控件整层铺在画面上，不占任何高度：卡片因此能长到贴近视口上下沿 */
.controls{position:absolute;inset:0;z-index:30;pointer-events:none}
.controls>*{pointer-events:auto}
.navrow{display:contents}
.nav-edge{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px}
#prev{left:clamp(8px,2vw,26px)}
#next{right:clamp(8px,2vw,26px)}
#nextWord{display:none}
.nav-auto{position:absolute;right:clamp(8px,2vw,26px);top:clamp(8px,2vh,20px)}
.dotwrap{position:absolute;left:0;right:0;bottom:clamp(8px,1.6vh,16px);max-width:none}
.dots{max-width:min(60vw,560px)}
.hint{display:none}
.nav{
  width:clamp(38px,4vw,48px);height:clamp(38px,4vw,48px);border-radius:50%;
  border:1px solid oklch(0.55 0.02 62 /.5);background:transparent;color:var(--paper);
  font-size:19px;cursor:pointer;display:grid;place-items:center;
  transition:background .3s ease,border-color .3s ease,transform .3s var(--ease);
}
.nav:hover{background:oklch(0.9 0.02 80 /.12);border-color:var(--paper);transform:translateY(-2px)}
.nav:active{transform:translateY(0) scale(.94)}
.nav:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
/* 自动轮播开关：比翻页按钮低一档，不抢主操作 */
.nav-auto{width:36px;height:36px;opacity:.5}
.nav-auto:hover{opacity:1}
.nav-auto:hover{opacity:1}
.nav-auto[aria-pressed="false"]{opacity:.38}
.nav-auto svg{display:block;width:12px;height:12px}
.next-word{font-family:var(--font-display);font-size:clamp(13px,1.15vw,15px);letter-spacing:.4em;color:var(--ink-faint);border:none;background:none;cursor:pointer;padding:6px 0 6px .4em;transition:color .3s ease}
.next-word:hover{color:var(--paper)}
.next-word:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
.dots{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(92vw,760px)}
.dots button{
  width:22px;height:3px;border:none;background:oklch(0.55 0.02 62 /.4);cursor:pointer;padding:0;
  transition:background .3s ease,width .4s var(--ease);
}
.dots button.on{width:40px;background:var(--paper)}
.dots button:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
.hint{font-family:var(--font-latin);font-style:italic;font-size:11px;letter-spacing:.08em;color:oklch(0.5 0.015 62);text-align:center}
.hint b{font-style:normal;color:oklch(0.72 0.015 62)}
.hint .h-narrow{display:none}

/* ============ 装载 / 兜底 ============ */
.toast{
  position:fixed;left:50%;bottom:clamp(16px,3vh,32px);z-index:60;
  transform:translateX(-50%) translateY(6px);
  padding:7px 14px;border-radius:999px;
  background:rgba(20,16,12,.92);border:1px solid oklch(0.55 0.02 62 /.4);
  color:oklch(0.88 0.015 70);font-size:12.5px;letter-spacing:.06em;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .26s ease,transform .26s var(--ease);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-latin);font-style:italic;font-size:13px;letter-spacing:.24em;
  color:oklch(0.55 0.015 62);
}
.loading.hide{display:none}
.err{max-width:460px;text-align:center;line-height:1.9;font-size:14px;color:oklch(0.7 0.02 62)}
.err code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:oklch(0.78 0.05 70)}

@media (max-width:760px){
  :root{
    --card-w:min(93vw,404px);
    --card-h:min(calc(var(--card-w) * 1.92),86vh);
    --card-h:min(calc(var(--card-w) * 1.92),86svh);
    --gap:6px;
  }
  /* 移动端关掉 3D 透视，只留平面位移，省一次矩阵运算与合成 */
  .gallery{perspective:none}
  /* 刊头藏起来，返回键单独浮在左上角 */
  .m-back{display:inline-flex}
  /* 手机上不要页头页脚：屏幕本来就窄，全部让给书卡。
     只留卡底那条进度线，它同时是「暂停/继续」的开关。 */
  .masthead{display:none}
  .navrow,.hint,.dots{display:none}
  .dotwrap{position:absolute;left:50%;bottom:3px;width:min(38vw,150px);gap:0;transform:translateX(-50%)}
  .masthead{grid-template-columns:1fr auto;padding:14px 18px 4px;gap:8px}
  .brand{gap:8px;min-width:0}
  .brand .mark{font-size:15px;white-space:nowrap}
  .brand .cn{font-size:10.5px;letter-spacing:.16em}
  .mast-seas{display:none}
  .mast-num{gap:10px;justify-self:end}
  .mast-num .cur{font-size:17px}
  .mast-num .sep{width:40px}
  .mast-num .tot{font-size:12px}
  .card{transform:translateX(calc(var(--rel,0) * (var(--card-w) + var(--gap)))) scale(var(--sc,1))}
  /* 封面按舞台高度定尺寸，永远不溢出被裁；剩余高度给「接着读」 */
    .stage-num{font-size:10.5cqw;bottom:2.6cqw}
  .titleblock{padding:3cqw 4.6cqw 0}
  .titleblock h3{font-size:6.6cqw;line-height:1.2}
  .why{padding:2.2cqw 4.6cqw 0}
  .why p{font-size:2.95cqw;line-height:1.74}
  .more{margin:2cqw 0 0;padding-top:2cqw}
  .more .cap{padding:0 4.6cqw}
  .more .row{gap:1.6cqw;margin-top:1.4cqw;padding:1px 4.6cqw 2px}
  .more .mini{width:22cqw}
  .foot{margin:1.8cqw 4.6cqw 0;padding:2cqw 0 2.4cqw}
  .go{padding:1.5cqw 2.6cqw;font-size:2.6cqw}
  .controls{gap:7px;padding:4px 14px 8px}
  .navrow{gap:12px}
  .nav{width:32px;height:32px;font-size:16px}
  .next-word{font-size:12px;letter-spacing:.3em}
  .dots{gap:4px;max-width:88vw}
  .dots button{width:12px}
  .dots button.on{width:20px}
  .hint{display:none}
  .hint .h-wide{display:none}
  .hint .h-narrow{display:inline}
}
@media (max-width:400px){
  /* 窄屏三步按钮最容易挤，缩字距、收内边距，别让「看市场怎么运转」断在半截 */
  .tabs{gap:1cqw;padding:2.4cqw 4.6cqw 0}
  .tab{padding:1.5cqw .6cqw;gap:.6cqw;font-size:max(2.35cqw,9.5px)}
  .tab i{font-size:2.3cqw}
  .tab em{font-size:1.9cqw}
}
@media (max-width:430px){
  :root{
    --card-w:93vw;
    --card-h:min(calc(var(--card-w) * 1.92),86vh);
    --card-h:min(calc(var(--card-w) * 1.92),86svh);
  }
  .titleblock h3{font-size:7cqw}
  .why p{-webkit-line-clamp:2;font-size:3.05cqw}
  .more .mini{width:24cqw}
  .more .mini .nm{font-size:max(2cqw,8.5px)}
  .masthead{padding:12px 14px 2px}
  .controls{padding:4px 12px 10px}
}
@media (max-width:360px){
  /* 极窄屏不砍掉「接着读」，只把它压成纯图条，避免卡底出现大片空白 */
  .titleblock h3{font-size:6.4cqw}
  .more{margin:1.6cqw 0 0;padding-top:1.6cqw}
  .more .cap{padding:0 4.6cqw}
  .more .row{margin-top:1cqw;padding:1px 4.6cqw 2px}
  .more .mini{width:26cqw}
  .more .mini .nm{display:none}
  .foot{margin-top:1.4cqw}
}
@media (prefers-reduced-motion:reduce){
  .card,.nav,.dots button,.mast-num .sep i,.go{transition-duration:.01ms}
}
</style>
</head>
<body>
<div class="app">

  <a class="backpill m-back" id="backBtnM" href="../">← 书单</a>

  <header class="masthead">
    <div class="brand">
      <a class="backpill" id="backBtn" href="../">← 书单</a>
      <span class="mark">The Reading Edit</span>
      <span class="cn">书卡频道</span>
    </div>
    <div class="mast-num">
      <span class="cur" id="mastCur">01</span>
      <span class="sep"><i id="mastBar"></i></span>
      <span class="tot" id="mastTot">--</span>
    </div>
    <div class="mast-seas" id="mastSeas">Curated · Autumn 2026</div>
  </header>

  <main class="gallery" id="gallery" aria-label="书卡画廊，使用左右方向键切换">
    <div class="loading" id="loading">SETTING THE TYPE …</div>
  </main>

  <footer class="controls">
    <div class="navrow">
      <button class="nav nav-edge" id="prev" aria-label="上一张书卡">‹</button>
      <button class="next-word" id="nextWord" aria-label="下一张书卡">下一页</button>
      <button class="nav nav-edge" id="next" aria-label="下一张书卡">›</button>
      <button class="nav nav-auto" id="autoBtn" aria-label="暂停自动轮播" aria-pressed="true"></button>
    </div>
    <div class="dotwrap">
      <button class="autobar" id="autobar" type="button" aria-label="暂停自动翻页"><i></i></button>
      <div class="dots" id="dots" role="tablist" aria-label="按书单跳转"></div>
    </div>
    <div class="hint"><span class="h-wide" id="hintW">← → 翻页 &nbsp;·&nbsp; 点击两侧卡片切换</span><span class="h-narrow" id="hintN">左右滑动翻页</span></div>
  </footer>

</div>

<script>
(function(){
  "use strict";
  var gallery=document.getElementById("gallery");
  var loading=document.getElementById("loading");
  var dotsBox=document.getElementById("dots");
  var mastCur=document.getElementById("mastCur");
  var mastTot=document.getElementById("mastTot");
  var mastBar=document.getElementById("mastBar");
  var mastSeas=document.getElementById("mastSeas");

  var cards=[], paths=[], pool=[], els=[], active=0, warmed={};

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function accent(c){
    return "oklch(0.58 0.105 "+c.hue+")";
  }
  function accentSoft(c){
    return "oklch(0.90 0.032 "+c.hue+")";
  }

  var STEPNUM=["①","②","③","④","⑤"];
  function bookHTML(b){
    var flag=b.fin?'<span class="bd">读毕</span>'
      :(b.prog>0?'<span class="bd">'+b.prog+'%</span>':'');
    return '<a class="sb" href="book.html?slug='+esc(b.slug)+'" title="'+esc(b.t)+'" aria-label="'+esc(b.t)+'">'+
           '<div class="th" style="--h:'+b.hue+'">'+
             '<img data-src="'+esc(b.cover)+'" alt="'+esc(b.t)+' 封面" loading="lazy" decoding="async">'+
             flag+
           '</div>'+
           '<div class="nm">'+esc(b.t)+'</div></a>';
  }
  function paintStep(el,k){
    var c=cards[+el.dataset.index];
    if(!c||!c.stages.length) return;
    k=Math.max(0,Math.min(k,c.stages.length-1));
    el.dataset.step=k;
    var st=c.stages[k];
    el.querySelector(".sinfo .nm").textContent=st.name;
    el.querySelector(".sinfo .aim").textContent=st.aim;
    var tip=el.querySelector(".sinfo .tip");
    tip.textContent=st.tip||"";
    tip.classList.toggle("is-empty",!st.tip);
    var bx=el.querySelector(".books");
    var html=st.books.map(bookHTML).join("");
    if(st.books.length<4){
      var nx=c.stages[k+1];
      html+='<button class="sb sb-next" type="button" data-next="'+(nx?(k+1):-1)+'"'+
            ' aria-label="'+(nx?('进入第 '+(k+2)+' 步：'+esc(nx.name)):'查看完整书单')+'">'+
              '<div class="th"><span class="tx">'+(nx?esc(nx.name):'看完整书单')+'</span></div>'+
              '<div class="nm">'+(nx?('下一步 →'):('全部 '+c.n+' 本 →'))+'</div>'+
            '</button>';
    }
    bx.innerHTML=html;
    bx.scrollLeft=0;
    var nxEl=bx.querySelector(".sb-next");
    if(nxEl) nxEl.addEventListener("click",function(e){
      e.stopPropagation();
      var t=+nxEl.dataset.next;
      if(t>=0) paintStep(el,t);
      else location.href="list.html?id="+encodeURIComponent(c.id);
    });
    [].forEach.call(el.querySelectorAll(".tab"),function(b,j){
      b.classList.toggle("on",j===k);
      b.setAttribute("aria-selected",String(j===k));
    });
    ensureImg(el);
  }
  function cardHTML(c){
    var lead=(c.stages[0]&&c.stages[0].books[0])||null;
    var tabs=c.stages.map(function(st,k){
      // 按钮上只放短名（冒号前那半截），全名留给 aria-label 和下方的阶段标题
      var shortName=String(st.name).split(/[：:，,]/)[0];
      return '<button class="tab'+(k===0?" on":"")+'" type="button" role="tab" data-step="'+k+'"'+
             ' aria-selected="'+(k===0)+'" aria-label="第 '+(k+1)+' 步 '+esc(st.name)+'，'+st.books.length+' 本">'+
             '<i>'+(STEPNUM[k]||(k+1))+'</i><span>'+esc(shortName)+'</span><em>'+st.books.length+'</em>'+
             '</button>';
    }).join("");
    var pct=c.n?Math.round(c.read/c.n*100):0;
    return '<div class="paper">'+
      '<div class="spine"></div>'+
      '<div class="card-head">'+
        '<div class="issue">NO.<b>'+String(c._i).padStart(2,"0")+'</b> &nbsp;·&nbsp; '+esc(c.field)+' &nbsp;·&nbsp; '+esc(c.level)+'</div>'+
        '<div class="hd-count">'+c.n+' 本 · '+c.nsteps+' 步</div>'+
      '</div>'+
      '<div class="stage">'+
        (lead?'<div class="stage-bg" data-bg="'+esc(lead.cover)+'"></div>':'')+
        '<div class="stage-tint"></div><div class="stage-wash"></div>'+
        (lead?'<a class="cover-wrap" href="book.html?slug='+esc(lead.slug)+'" style="--h:'+lead.hue+'"'+
          ' title="'+esc(lead.t)+'" aria-label="读《'+esc(lead.t)+'》">'+
          '<div class="cover-ph">'+esc(lead.t)+'</div>'+
          '<img data-src="'+esc(lead.cover)+'" alt="'+esc(lead.t)+' 封面" loading="lazy" decoding="async">'+
        '</a>':'')+
        '<div class="stage-title">'+
          '<h3>'+esc(c.main)+'</h3>'+
          '<div class="s">'+esc(c.sub)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="tabs" role="tablist" aria-label="书单的三个步骤">'+tabs+'</div>'+
      '<div class="sinfo">'+
        '<div class="nm"></div><div class="aim"></div><div class="tip"></div>'+
      '</div>'+
      '<div class="books"></div>'+
      '<div class="foot">'+
        '<div class="bar">'+
          '<div class="track"><i style="width:'+(pct?Math.max(3,pct):0)+'%"></i></div>'+
          '<div class="leg"><span>'+esc(c.field)+' · '+esc(c.level)+'</span>'+
            '<span>'+(c.read?("开卷 "+c.read+" / "+c.n):"未开卷")+'</span></div>'+
        '</div>'+
        '<a class="go" href="list.html?id='+esc(c.id)+'">领读 →</a>'+
      '</div>'+
    '</div>';
  }

  /* 卡片不一次性建内容：先只建空壳，进入可视窗口（|rel|<=2）才填 HTML。
     这样首屏只解析 5 张卡的字符串，翻一页只解析 1 张，移动端不会卡在首帧。 */
  function build(){
    var frag=document.createDocumentFragment();
    cards.forEach(function(c,i){
      c._i=i+1;
      var el=document.createElement("article");
      el.className="card is-far";
      el.tabIndex=-1;
      el.dataset.index=i;
      el.setAttribute("role","button");
      el.setAttribute("aria-label","第 "+(i+1)+" 个书单："+c.title);
      el.addEventListener("click",function(e){
        if(e.target.closest("a")) return;   // 链接自己走，别顺带切卡
        if(i!==active) go(i);
      });
      el.addEventListener("keydown",function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); if(i!==active) go(i); }
      });
      frag.appendChild(el);
      els.push(el);
    });
    gallery.appendChild(frag);
  }

  function fill(el,i){
    if(el.dataset.filled===String(i)) return;
    var c=cards[i];
    el.style.setProperty("--accent",accent(c));
    el.style.setProperty("--accent-soft",accentSoft(c));
    el.style.setProperty("--h",c.hue);
    el.innerHTML=cardHTML(c);
    [].forEach.call(el.querySelectorAll(".tab"),function(b){
      b.addEventListener("click",function(e){
        e.stopPropagation();          // 别让点步骤顺带被当成点卡片
        paintStep(el,+b.dataset.step);
      });
    });
    paintStep(el,+el.dataset.step||0);
    el.dataset.filled=i;
  }

  function ensureImg(el){
    var imgs=el.querySelectorAll("img[data-src]");
    for(var k=0;k<imgs.length;k++){
      var im=imgs[k];
      if(!im.src){
        im.addEventListener("load",function(){
          var w=this.parentNode;
          if(w&&w.classList&&w.classList.contains("cover-wrap")) w.classList.add("has-img");
        });
        im.addEventListener("error",function(){
          var w=this.parentNode;
          if(w&&w.classList&&w.classList.contains("cover-wrap")) w.classList.remove("has-img");
        });
        im.src=im.getAttribute("data-src");
        im.removeAttribute("data-src");
      }
    }
    var bg=el.querySelector(".stage-bg[data-bg]");
    if(bg&&!bg.style.backgroundImage){
      bg.style.backgroundImage='url("'+bg.getAttribute("data-bg")+'")';
      bg.removeAttribute("data-bg");
    }
  }

  /* 卡片按画廊的实际可用区域定尺寸：高度吃满，宽度按比例反推。
     原来用 vh/vw 猜，安卓浏览器的地址栏一收起就对不上，上下永远差一截。 */
  function sizeCard(){
    // .app 高度按真实视口写死：iOS 的 100dvh 在地址栏收放时会滞后，卡片跟着抖
    var appEl=document.querySelector(".app");
    if(appEl) appEl.style.height=window.innerHeight+"px";
    var gw=gallery.clientWidth, gh=gallery.clientHeight;
    if(!gw||!gh) return;

    var w,h;
    if(gw<=760){
      // 手机：只留左右 10px 给翻页动画看，上下几乎贴边
      w=gw-20; h=gh-14;
      if(h<w*1.7){ h=Math.min(w*1.7,gh-14); w=h/1.7; }   // 横屏：先保高度
      if(h>w*2.34) h=w*2.34;                              // 别把卡拉成面条
    }else{
      // 桌面：高度吃满（扣掉上方页码和下方控件），宽度按竖版比例反推
      var ratio=1.78;
      h=Math.min(gh-100,gw*0.56*ratio);
      w=h/ratio;
    }
    gallery.style.setProperty("--card-w",w.toFixed(1)+"px");
    gallery.style.setProperty("--card-h",h.toFixed(1)+"px");
  }

  function layout(){
    var n=cards.length, half=n/2;
    // 桌面上相邻卡不再隐身：留在身后盖一层遮罩，一眼就看出这是一摞可以翻的卡
    var wide=gallery.clientWidth>760;
    els.forEach(function(el,i){
      var rel=i-active;
      if(rel>half) rel-=n;
      if(rel<-half) rel+=n;
      var abs=Math.abs(rel);
      el.style.setProperty("--rel",rel);
      if(abs===0){
        el.className="card is-active";
        el.style.setProperty("--sc",1);el.style.setProperty("--ry","0deg");
        el.style.zIndex=10;
        el.style.visibility="visible";el.style.opacity=1;el.style.pointerEvents="auto";
        el.setAttribute("aria-pressed","true");
      }else if(abs===1){
        el.className="card is-near";
        el.style.setProperty("--sc",.84);el.style.setProperty("--ry",(rel>0?-7:7)+"deg");
        el.style.zIndex=9;
        el.style.visibility="visible";el.style.opacity=wide?1:0;el.style.pointerEvents="none";
        el.setAttribute("aria-pressed","false");
      }else if(abs===2){
        el.className="card is-side";
        el.style.setProperty("--sc",.7);el.style.setProperty("--ry",(rel>0?-12:12)+"deg");
        el.style.zIndex=8;
        el.style.visibility="visible";el.style.opacity=0;el.style.pointerEvents="none";
        el.setAttribute("aria-pressed","false");
      }else{
        el.className="card is-far";
        el.style.setProperty("--sc",.7);
        el.style.zIndex=1;el.style.pointerEvents="none";
        el.setAttribute("aria-pressed","false");
      }
      if(abs<=2){ fill(el,i); ensureImg(el); }
      el.tabIndex = abs===0 ? 0 : -1;
    });
    // 提前把下一张的图拉进缓存，翻页不白屏（用脱离文档的 Image 预热，不动 DOM 里的 img）
    var ahead=(active+1)%n, prev=(active-1+n)%n;
    [ahead,prev].forEach(function(k){
      var el=els[k];
      if(!el) return;
      el.querySelectorAll("img[data-src]").forEach(function(im){
        var u=im.getAttribute("data-src");
        if(u&&!warmed[u]){ warmed[u]=1; var w=new Image(); w.decoding="async"; w.src=u; }
      });
    });
    var c=cards[active];
    mastCur.textContent=String(active+1).padStart(2,"0");
    mastTot.textContent=String(n).padStart(2,"0");
    var w=100/n;
    mastBar.style.width=w+"%";
    mastBar.style.left=(active*w)+"%";
    mastSeas.innerHTML="<b>"+esc(c.field)+"</b> · "+esc(c.main);
    [].forEach.call(dotsBox.children,function(b,j){
      b.classList.toggle("on",j===active);
      b.setAttribute("aria-selected",String(j===active));
    });
    document.getElementById("hintW").innerHTML =
      "<b>"+esc(c.main)+"</b> &nbsp;·&nbsp; "+c.n+" 本 · "+c.nsteps+" 步 &nbsp;·&nbsp; ← → 翻页 · 滚轮 · 手指滑动";
    document.getElementById("hintN").textContent =
      c.n+" 本 · "+c.nsteps+" 步 · 左右滑动";
  }

  function go(i){
    var n=cards.length;
    var prev=active;
    active=((i%n)+n)%n;
    // 换卡时步骤回到 ①：自动轮动的节奏是「①②③ → 下一张」，每次进场都从头走
    if(active!==prev){
      var el=els[active];
      if(el&&el.dataset.filled!==undefined&&(+el.dataset.step||0)!==0) paintStep(el,0);
    }
    try{ history.replaceState(null,"","#"+String(active+1)); }catch(e){}
    layout();
    autoCycle();
    autoSync();
  }

  function render(){
    sizeCard();
    build();
    layout();
    autoCycle();
  }

  /* ---------- 自动轮播 ----------
     拿 CSS 动画当计时器：animationend 就是翻页信号，暂停直接 animation-play-state，
     进度条和倒计时天然同步，不用自己算剩余时间。
     节奏：先在当前书单里把步骤 ①②③ 各停一轮，轮完翻到下一张书单卡——
     一进来就能看见卡在动，才知道可以左右滑。 */
  var AUTO_MS=4200;
  var autoBar=document.getElementById("autobar");
  var autoBtn=document.getElementById("autoBtn");
  var autoFill=autoBar.querySelector("i");
  var reduceMotion=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  var autoOn=!reduceMotion;          // 系统开了「减少动态效果」就不自动播
  var hovering=false, idleHold=false, idleT=null;

  var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.6" y="4.4" width="4" height="15.2" rx="1" fill="currentColor"/><rect x="13.4" y="4.4" width="4" height="15.2" rx="1" fill="currentColor"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.2v15.6L20 12z" fill="currentColor"/></svg>';

  function paintAutoBtn(){
    autoBtn.innerHTML=autoOn?ICON_PAUSE:ICON_PLAY;
    autoBtn.setAttribute("aria-pressed",String(autoOn));
    autoBtn.setAttribute("aria-label",autoOn?"暂停自动轮播":"开始自动轮播");
    autoBar.setAttribute("aria-label",autoOn?"暂停自动翻页":"开始自动翻页");
  }

  function autoCycle(){            // 从 0 起播一轮
    autoBar.classList.remove("is-run","is-paused");
    if(!autoOn) return;
    autoBar.style.setProperty("--auto-ms",AUTO_MS+"ms");
    void autoBar.offsetWidth;      // 强制回流，动画才会重跑
    autoBar.classList.add("is-run");
  }
  function autoSync(){             // 按「开着没 / 鼠标在上面 / 刚操作过」决定播不播
    if(!autoOn){ autoBar.classList.remove("is-run","is-paused"); return; }
    if(hovering||idleHold) autoBar.classList.add("is-paused");
    else if(autoBar.classList.contains("is-run")) autoBar.classList.remove("is-paused");
    else autoCycle();
  }
  function autoHold(){             // 用户动手了：先停，静一会儿再续
    idleHold=true; autoSync();
    clearTimeout(idleT);
    idleT=setTimeout(function(){ idleHold=false; autoSync(); },12000);
  }

  autoFill.addEventListener("animationend",function(){
    if(!autoOn||hovering||idleHold) return;
    var el=els[active], c=cards[active];
    if(!el||!c) return;
    var k=+el.dataset.step||0;
    // 步骤没轮完：在同一张卡里切下一步；轮完了：翻下一张书单卡
    if(c.stages.length>1&&k<c.stages.length-1){
      paintStep(el,k+1);
      autoCycle();
    }else{
      go(active+1);
    }
  });

  autoBtn.addEventListener("click",function(){
    autoOn=!autoOn;
    paintAutoBtn();
    idleHold=false; hovering=false;
    clearTimeout(idleT);
    if(autoOn) autoCycle(); else autoBar.classList.remove("is-run","is-paused");
  });
  paintAutoBtn();

  // 鼠标停在卡上就停：桌面端鼠标常驻，不停的话永远轮不到下一页
  gallery.addEventListener("pointerenter",function(e){
    if(e.pointerType==="touch") return;
    hovering=true; autoSync();
  });
  gallery.addEventListener("pointerleave",function(e){
    if(e.pointerType==="touch") return;
    hovering=false; autoSync();
  });
  gallery.addEventListener("pointerdown",autoHold);
  gallery.addEventListener("pointerup",function(e){
    if(e.pointerType==="touch") autoHold();
  });
  gallery.addEventListener("wheel",autoHold,{passive:true});
  document.addEventListener("touchstart",autoHold,{passive:true});
  autoBtn.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden) autoBar.classList.add("is-paused");
    else autoSync();
  });

  function dotsFor(){
    // 一个点对应一条书单
    cards.forEach(function(c,j){
      var b=document.createElement("button");
      b.type="button";
      b.title=c.field+" · "+c.title;
      b.setAttribute("aria-label",c.field+"："+c.title+"（"+c.n+" 本 · "+c.nsteps+" 步）");
      b.addEventListener("click",function(){ go(j); });
      dotsBox.appendChild(b);
    });
  }

  // 滚轮 / 触摸 / 轨道拖拽
  // 卡片里每个阶段一条横向轨道，手势得先让轨道用：轨道上滑 = 横着翻书，
  // 滑到头再继续才翻下一张卡，不然想看完这一阶段的最后一本会直接跳卡。
  var lock=false;
  function railOf(e){
    return e.target&&e.target.closest?e.target.closest(".books"):null;
  }
  function wheel(e){
    var row=railOf(e);
    if(row){
      var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
      var max=row.scrollWidth-row.clientWidth;
      var atEnd=row.scrollLeft>=max-2, atStart=row.scrollLeft<=2;
      if(!((d>0&&atEnd)||(d<0&&atStart))){
        e.preventDefault();
        row.scrollLeft+=d;
        return;
      }
    }
    if(lock) return;
    if(Math.abs(e.deltaY)<8&&Math.abs(e.deltaX)<8) return;
    lock=true;
    setTimeout(function(){lock=false;},320);
    if(e.deltaY>0||e.deltaX>0) go(active+1); else go(active-1);
  }
  gallery.addEventListener("wheel",wheel,{passive:false});

  // 手势挂整页而不是只挂 gallery：右滑常常从卡片左侧的空白处、甚至页头起步，
  // 摸不到 gallery 就等于把这一下白送给浏览器的「右滑返回上一页」。
  // 判定为横向翻卡后立刻 preventDefault，把控制权从浏览器手里抢回来。
  // 轨道内先让浏览器原生滚（滚起来才有卡位感），滚到头再继续同向滑就接管翻卡——
  // 不然轨道停在最左时右滑没得滚，手势会整个被浏览器当成返回。
  var tx=0,ty=0,inRail=false,tAxis=0,tRow=null;
  // tAxis 0=待判 1=横着翻卡 2=竖直放行 -1=多指
  function tStart(e){
    if(e.touches.length>1){ tAxis=-1; return; }
    tRow=railOf(e); inRail=!!tRow;
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;tAxis=0;
  }
  function tMove(e){
    if(tAxis===2) return;
    if(tAxis===-1){ if(e.touches.length<2) tAxis=0; else return; }
    var t=e.touches[0], dx=t.clientX-tx, dy=t.clientY-ty;
    if(!tAxis){
      if(Math.abs(dx)<12&&Math.abs(dy)<12) return;
      tAxis=Math.abs(dx)>Math.abs(dy)?1:2;
      if(tAxis===2) return;
    }
    if(inRail){
      var max=tRow.scrollWidth-tRow.clientWidth;
      var stuck=max<=2||(dx<0?tRow.scrollLeft>=max-2:tRow.scrollLeft<=2);
      if(!stuck) return;                 // 还滚得动，交给原生滚动
      inRail=false;                      // 滑到头了，接过来翻卡
    }
    if(e.cancelable) e.preventDefault();
  }
  var swipeLock=0;
  function tEnd(e){
    if(tAxis===1&&!inRail){
      var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)) go(active+(dx<0?1:-1));
    }
    var tt=e.changedTouches[0];
    if(tt&&(Math.abs(tt.clientX-tx)>10||Math.abs(tt.clientY-ty)>10)) swipeLock=Date.now()+400;
    inRail=false;tAxis=0;tRow=null;
  }
  document.addEventListener("touchstart",tStart,{passive:true});
  document.addEventListener("touchmove",tMove,{passive:false});
  document.addEventListener("touchend",tEnd,{passive:true});
  document.addEventListener("touchcancel",function(){ inRail=false;tAxis=0;tRow=null; },{passive:true});

  // 桌面没有触摸屏，用鼠标拖轨道
  var dragRow=null, dragX=0, dragL=0, dragMoved=false;
  gallery.addEventListener("pointerdown",function(e){
    var row=railOf(e);
    if(!row||e.pointerType==="touch") return;
    dragRow=row; dragX=e.clientX; dragL=row.scrollLeft; dragMoved=false;
    row.classList.add("is-drag");
  });
  window.addEventListener("pointermove",function(e){
    if(!dragRow) return;
    var dx=e.clientX-dragX;
    if(Math.abs(dx)>3) dragMoved=true;
    dragRow.scrollLeft=dragL-dx;
  });
  window.addEventListener("pointerup",function(){
    if(!dragRow) return;
    dragRow.classList.remove("is-drag");
    dragRow=null;
    setTimeout(function(){ dragMoved=false; },0);
  });
  // 拖完手一松会落到链接上，别让它顺势跳走
  gallery.addEventListener("click",function(e){
    if(dragMoved||Date.now()<swipeLock){ e.preventDefault(); e.stopPropagation(); }
  },true);

  // 点卡片两侧的空白也能翻页：桌面上想翻页时手很容易落在书上，一点就跳到详情页
  gallery.addEventListener("click",function(e){
    if(e.target.closest(".card")) return;
    if(gallery.clientWidth<=760) return;
    go(active+(e.clientX<window.innerWidth/2?-1:1));
  });

  // 手机上没有按钮了，双击卡面空白处开关自动轮播（书封链接照常跳转）
  var toastEl=document.createElement("div");
  toastEl.className="toast";
  document.body.appendChild(toastEl);
  var toastT=null;
  function say(t){
    toastEl.textContent=t;
    toastEl.classList.add("on");
    clearTimeout(toastT);
    toastT=setTimeout(function(){ toastEl.classList.remove("on"); },1300);
  }
  autoBar.addEventListener("click",function(e){
    e.stopPropagation();
    autoOn=!autoOn;
    paintAutoBtn();
    idleHold=false; hovering=false; clearTimeout(idleT);
    clearTimeout(idleT);
    if(autoOn) autoCycle(); else autoBar.classList.remove("is-run","is-paused");
    say(autoOn?"自动翻页已开启":"自动翻页已暂停");
  });

  // 返回书单Tab：被首页 iframe 嵌着时藏起来（外层 Tab 本身就是回程），独立打开才显示；
  // 独立打开时优先 history.back() 回到来源页，没有来源就直接回首页书单区
  var framed=false;
  try{ framed=window.top!==window.self; }catch(e){ framed=true; }
  var backLinks=[document.getElementById("backBtn"),document.getElementById("backBtnM")];
  if(framed){
    backLinks.forEach(function(b){ if(b) b.style.display="none"; });
  }else{
    backLinks.forEach(function(b){
      if(!b) return;
      b.addEventListener("click",function(e){
        if(history.length>1&&document.referrer){ e.preventDefault(); history.back(); }
      });
    });
  }

  document.getElementById("next").addEventListener("click",function(){go(active+1)});
  document.getElementById("prev").addEventListener("click",function(){go(active-1)});
  document.getElementById("nextWord").addEventListener("click",function(){go(active+1)});
  document.addEventListener("keydown",function(e){
    autoHold();
    if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(active+1);}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(active-1);}
    else if(e.key==="Home"){e.preventDefault();go(0);}
    else if(e.key==="End"){e.preventDefault();go(cards.length-1);}
    else if(e.key===" "||e.key==="Spacebar"){e.preventDefault();autoBtn.click();}
  });

  // 窗口尺寸/横竖屏变了重新量一次：卡片高度跟着画廊走，不能靠 vh 缓存
  var rszT=null;
  function onResize(){
    clearTimeout(rszT);
    rszT=setTimeout(function(){ sizeCard(); layout(); },120);
  }
  window.addEventListener("resize",onResize);
  window.addEventListener("orientationchange",onResize);
  // 字体晚到会改变控件高度，画廊高度跟着变，量第二遍才准
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(onResize);

  function fail(msg){
    loading.classList.remove("hide");
    loading.innerHTML='<div class="err">书卡数据没装上。<br>'+msg+
      '<br><br><code>python3 tools/booklist/build_cards.py</code></div>';
  }

  fetch("cards.json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      cards=d.lists||[]; paths=d.paths||[]; pool=d.pool||[];
      if(!cards.length) throw new Error("lists 为空，重跑 build_cards.py");
      loading.classList.add("hide");
      dotsFor();
      var m=location.hash.match(/^#(\d+)$/);
      if(m){
        var k=parseInt(m[1],10)-1;
        if(k>=0&&k<cards.length) active=k;
      }
      render();
    })
    .catch(function(e){ fail(esc(e.message||String(e))); });
})();
</script>
</body>
</html>
