<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 跟随首页 Aa 主题：rd-cfg.theme（cream/light/green/dark） */
try{var _c=JSON.parse(localStorage.getItem('rd-cfg')||'{}');document.documentElement.dataset.theme=_c.theme||'cream';}catch(e){document.documentElement.dataset.theme='cream';}
</script>
<title>书卡详情 · 书卡频道</title>
<link rel="stylesheet" href="app.css">
<style>
/* ============================================================
   书卡详情 · 版式规范
   ------------------------------------------------------------
   容器      1320px（内容约 1208），宽屏把横向空间吃满，
             避免正文挤在中间一窄条
   栏宽      12 栏 / 24px gutter，实际只用两栏：封面栏 268 + 正文栏
   字号阶梯  46 / 34 / 17 / 14 / 12 / 11 —— 六档，不再出现 13.5/11.5 这类中间值
   行高      标题 1.28，正文 1.9，小字 1.6
   间距      4 的倍数：8 / 12 / 16 / 24 / 32 / 48 / 64
   圆角      封面 3px、卡片 2px、胶囊 999 —— 只有三种
   阴影      只有两级：封面投影 / 悬停抬升
   ============================================================ */

.wrap{max-width:1320px;padding:0 clamp(18px,4vw,56px) 72px}

/* ============ Hero ============ */
.hero{
  display:grid;
  /* 封面列 = 封面宽 + 左右各 70px 的箭头区，箭头离书封有一臂距离 */
  grid-template-columns:calc(clamp(200px,23vw,268px) + 140px) minmax(0,1fr);
  gap:clamp(24px,4.4vw,64px);
  padding:clamp(16px,3vh,36px) 0 clamp(30px,5vh,56px);
  align-items:stretch;
  border-bottom:1px solid oklch(0.28 0.013 62);
}

/* 封面栏：光晕用封面色相，跟画廊里那张卡的气场接上 */
.stage{position:relative;display:flex;align-items:flex-start;padding:0 70px}
.coverbox .glow{
  position:absolute;inset:-18% -22% -10%;
  background:radial-gradient(60% 52% at 46% 34%,
    oklch(0.52 0.09 var(--h,66) / .5) 0%,transparent 72%);
  filter:blur(28px);pointer-events:none;
}
.cover{
  position:relative;width:100%;aspect-ratio:3/4.16;border-radius:3px;overflow:hidden;
  background:oklch(0.3 0.02 62);
  box-shadow:0 26px 52px -12px rgba(0,0,0,.62),0 6px 16px rgba(0,0,0,.4),
             0 0 0 1px rgba(255,255,255,.07);
}
/* 封面上可点：跟「领读全文」同一个去处 */
a.cover{display:block;text-decoration:none;color:inherit;cursor:pointer}
a.cover::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0);
  transition:box-shadow .32s ease;
}
a.cover:hover::after,a.cover:focus-visible::after{box-shadow:inset 0 0 0 1px rgba(226,201,159,.5)}
a.cover:hover img{transform:scale(1.028)}
a.cover:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
@media (prefers-reduced-motion:reduce){a.cover:hover img{transform:none}}

/* 封面左右：上一本 / 下一本（全程在书封外的空白里，不压封面） */
.coverbox{position:relative;width:100%}
.bnav{
  position:absolute;top:50%;z-index:3;
  width:38px;height:38px;border-radius:999px;
  display:grid;place-items:center;
  color:oklch(0.73 0.012 72);
  background:transparent;
  border:1px solid oklch(0.85 0 0 / .16);
  transform:translateY(-50%);
  opacity:.9;
  transition:color .2s ease,border-color .2s ease,background .2s ease,transform .2s var(--ease);
}
.bnav svg{width:17px;height:17px;display:block}
.bnav.next svg{transform:scaleX(-1)}
.bnav.prev{left:-70px}
.bnav.next{right:-70px}
.bnav:hover{color:oklch(0.96 0.01 80);border-color:oklch(0.95 0 0 / .34);background:oklch(1 0 0 / .05)}
.bnav.prev:hover{transform:translate(-2px,-50%)}
.bnav.next:hover{transform:translate(2px,-50%)}
.bnav:focus-visible{outline:2px solid var(--paper);outline-offset:3px;color:oklch(0.96 0.01 80)}
.bnav[aria-disabled="true"]{opacity:.16;pointer-events:none}
html:not([data-theme="dark"]) .bnav{color:#7d8a83;border-color:rgba(36,49,46,.16)}
html:not([data-theme="dark"]) .bnav:hover{color:#24312e;border-color:rgba(36,49,46,.34);background:rgba(36,49,46,.045)}
.cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{
  position:absolute;inset:0;display:grid;place-items:center;padding:14px;
  font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.42;
  text-align:center;color:oklch(0.88 0.02 72);
  background:linear-gradient(160deg,oklch(0.34 0.03 var(--h,62)),oklch(0.22 0.03 var(--h,62)));
}

/* 正文栏 */
.meta{min-width:0;display:flex;flex-direction:column;padding-top:2px}
.kicker{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-family:var(--font-latin);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:oklch(0.6 0.015 66);
}
.kicker .dot{width:3px;height:3px;border-radius:50%;background:oklch(0.5 0.02 66);flex:none}
.kicker b{font-weight:400;color:oklch(0.76 0.02 70);letter-spacing:.14em}

h1{
  margin-top:16px;
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(27px,3.4vw,44px);line-height:1.28;letter-spacing:.015em;
  text-wrap:balance;
}
/* 书名即入口：统一跳微信读书搜索页（不依赖 bookId，任何书都点得动） */
h1 a{color:inherit;text-decoration:none;transition:color .16s ease}
h1 a::after{
  content:"↗";display:inline-block;margin-left:.28em;
  font:400 .5em/1 var(--sans);vertical-align:.34em;opacity:.5;
  transition:opacity .16s ease;
}
h1 a:hover,h1 a:focus-visible{color:#e2c99f}
h1 a:hover::after,h1 a:focus-visible::after{opacity:.95}
h1 a:focus-visible{outline:2px solid #b08a3e;outline-offset:4px;border-radius:4px}
html:not([data-theme="dark"]) h1 a:hover,html:not([data-theme="dark"]) h1 a:focus-visible{color:#8a6a2e}
/* 书名下一行：作者在左，两个主入口在右（金色实心 + 描边），
   「领读全文」藏到页面底部没人看见，挪上来并改叫 AI阅读 / AI听书 */
.metahead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.metahead .by{margin-top:0;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.by{font-size:14px;line-height:1.6;color:oklch(0.7 0.016 66);letter-spacing:.03em}
.by::before{content:"— ";color:oklch(0.56 0.06 72)}
.h1cta{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.h1cta .cta{
  display:inline-flex;align-items:center;gap:5px;
  padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;
  font:600 13px/1 var(--sans);letter-spacing:.02em;border:1px solid transparent;
  -webkit-tap-highlight-color:transparent;
  transition:transform .16s var(--ease),background .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.h1cta .cta-emoji{font-size:16px;line-height:1;transform:translateY(.5px)}
.h1cta .cta-read{
  background:#b08a3e;color:#1b150c;
  box-shadow:0 8px 20px -8px rgba(176,138,62,.85);
}
.h1cta .cta-read:hover{background:#c39a49;transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(192,150,69,.9)}
.h1cta .cta-listen{background:transparent;color:inherit;border-color:oklch(0.62 0.05 72 / .55)}
.h1cta .cta-listen:hover{border-color:#c39a49;color:#e2c99f;transform:translateY(-1px)}
.h1cta .cta:active{transform:translateY(0)}
.h1cta .cta:focus-visible{outline:2px solid #e2c99f;outline-offset:3px}
html:not([data-theme="dark"]) .h1cta .cta-listen{border-color:oklch(0.62 0.05 72 / .45);color:inherit}
html:not([data-theme="dark"]) .h1cta .cta-listen:hover{color:#8a6a2e;border-color:#8a6a2e}
@media (max-width:640px){
  .metahead{gap:10px}
  .metahead .by{flex-basis:100%;white-space:normal;overflow:visible}
  .h1cta{flex-basis:100%;margin-left:0;justify-content:flex-end}
  .h1cta .cta{padding:9px 15px;font-size:12.5px}
}

/* 荐语：引号压在左上，正文首行缩进避开 */
.why{
  position:relative;margin-top:clamp(18px,3vh,28px);
  width:fit-content;max-width:min(100%,560px);
  padding:18px 24px 18px 32px;border-radius:2px;
  background:linear-gradient(100deg,oklch(0.245 0.016 64) 0%,oklch(0.215 0.013 62) 100%);
  border-left:2px solid oklch(0.6 0.075 70);
}
.why .q{
  position:absolute;left:9px;top:8px;
  font-family:var(--font-latin);font-size:30px;line-height:1;
  color:oklch(0.62 0.075 70 / .55);
}
.why p{font-size:14.5px;line-height:1.92;color:oklch(0.88 0.012 76);text-wrap:pretty}
.why .lb{
  margin-top:10px;font-family:var(--font-latin);font-style:italic;
  font-size:11px;letter-spacing:.14em;color:oklch(0.56 0.05 70);
}

/* 进度：一条横贯正文栏，比三格数字省一半高度，读起来也更像「读到哪儿」 */
.prog{margin-top:clamp(20px,3.2vh,30px)}
.prog .top{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:12px;letter-spacing:.08em;color:oklch(0.6 0.014 66);
}
.prog .top b{
  font-family:var(--font-latin);font-weight:400;font-size:19px;
  color:oklch(0.93 0.012 80);letter-spacing:.01em;
}
.prog .bar{
  margin-top:9px;height:3px;border-radius:2px;overflow:hidden;
  background:oklch(0.31 0.012 62);
}
.prog .bar i{
  display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,oklch(0.62 0.075 68),oklch(0.78 0.075 76));
  transition:width .6s var(--ease);
}

/* 原文摘录：替代原来的阅读进度条，2~3 句原句，引号压左侧 */
.quotes{margin-top:clamp(18px,3vh,28px);max-width:680px}
.quotes .qh{
  display:flex;align-items:baseline;gap:10px;
  font-size:12px;letter-spacing:.1em;color:var(--ink-faint);
}
.quotes .qh em{
  font-family:var(--font-latin);font-style:normal;
  font-size:10.5px;letter-spacing:.16em;opacity:.72;
}
.quotes ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.quotes li{
  position:relative;padding-left:17px;font-size:13.5px;line-height:1.88;
  color:var(--fg);text-wrap:pretty;
}
.quotes li::before{
  content:"“";position:absolute;left:0;top:-3px;
  font-family:var(--font-latin);font-size:21px;line-height:1;
  color:#bf8247;opacity:.62;
}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:clamp(20px,3.2vh,30px)}
.actions .btn{padding:11px 22px;font-size:13px}

/* ============ 区块通用头 ============ */
.sec{padding-top:clamp(30px,4.6vh,52px)}
.sec-head{
  display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
  padding-bottom:12px;border-bottom:1px solid oklch(0.27 0.013 62);
}
.sec-head .no{
  font-family:var(--font-latin);font-size:12px;letter-spacing:.12em;
  color:oklch(0.5 0.02 64);flex:none;
}
.sec-head h2{
  font-family:var(--font-display);font-weight:700;
  font-size:17px;letter-spacing:.08em;flex:none;
}
.sec-head em{
  font-family:var(--font-latin);font-style:normal;font-size:11.5px;
  letter-spacing:.1em;color:oklch(0.56 0.014 66);
}
.sec-head .more{
  margin-left:auto;flex:none;font-size:12px;letter-spacing:.06em;
  color:oklch(0.78 0.05 72);text-decoration:none;
  border-bottom:1px solid oklch(0.78 0.05 72 / .35);padding-bottom:1px;
}
.sec-head .more:hover{border-bottom-color:oklch(0.78 0.05 72)}

/* ============ 书单轨迹：整条单铺开，当前书高亮 ============ */
.strip{
  display:flex;gap:clamp(8px,1.2vw,14px);overflow-x:auto;padding:2px 2px 10px;
  scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none;
}
.strip::-webkit-scrollbar{display:none}
/* 一本 flex 一份，书少时自动摊开铺满一行；超过 12 本才横向滚 */
.pb{
  flex:1 1 0;min-width:54px;max-width:104px;
  text-decoration:none;scroll-snap-align:start;
  opacity:.4;transition:opacity .25s ease,transform .25s var(--ease);
}
.pb:hover{opacity:.82;transform:translateY(-2px)}
.pb.on{opacity:1;transform:translateY(-3px)}
.pb .th{
  position:relative;width:100%;aspect-ratio:3/4.16;border-radius:2px;overflow:hidden;
  background:oklch(0.32 0.02 62);box-shadow:0 3px 9px rgba(0,0,0,.34);
}
.pb.on .th{outline:1.5px solid oklch(0.78 0.07 72);outline-offset:2px}
.pb .th img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.pb .n{
  margin-top:5px;font-family:var(--font-latin);font-size:9.5px;
  letter-spacing:.1em;color:oklch(0.56 0.014 66);text-align:center;
}

.goal{
  margin-top:16px;font-size:13px;line-height:1.95;
  color:oklch(0.68 0.015 68);max-width:82ch;
}
.goal span{
  display:inline-block;margin-right:10px;
  font-size:11px;letter-spacing:.14em;
  color:oklch(0.58 0.05 70);
  border:1px solid oklch(0.4 0.03 66 / .6);border-radius:2px;
  padding:1px 7px;vertical-align:1px;white-space:nowrap;
}

/* ============ 关联阅读：与「这条书单」的封面同一尺寸 ============ */
/* 用 grid 等分列宽，卡片随容器自适应，右边不会剩一条固定空白 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:16px 10px;
}
.rk{
  display:block;min-width:0;
  text-decoration:none;
}
@media (min-width:761px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
}
@media (min-width:1100px){
  .pb{max-width:116px}
}
.rk .th{
  position:relative;width:100%;aspect-ratio:3/4.16;border-radius:3px;overflow:hidden;
  background:oklch(0.3 0.02 62);
  box-shadow:0 8px 20px -6px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);
  transition:transform .26s var(--ease),box-shadow .26s ease;
}
.rk:hover .th{transform:translateY(-4px);box-shadow:0 18px 34px -8px rgba(0,0,0,.62),0 4px 12px rgba(0,0,0,.4)}
.rk:focus-visible .th{outline:2px solid var(--paper);outline-offset:3px}
.rk .th img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.rk .tg{
  position:absolute;left:0;top:0;z-index:2;
  padding:3px 5px;border-radius:0 0 3px 0;
  font-size:9px;line-height:1;letter-spacing:.04em;
  color:oklch(0.96 0.006 82);background:oklch(0.18 0.01 62 / .58);
  opacity:.66;transition:opacity .22s ease;
}
.rk:hover .tg,.rk:focus-visible .tg{opacity:1}
.rk .tg.is-author{background:oklch(0.46 0.115 46 / .92)}
.rk .tg.is-step{background:oklch(0.4 0.075 150 / .9)}
.rk .nm{
  margin-top:6px;font-size:11px;line-height:1.42;color:oklch(0.86 0.012 74);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  /* 两行均衡断行，别出现「一共七个字 + 末行孤零零一个字」 */
  text-wrap:balance;
  /* 定高两行：书名一行的和两行的卡底边才对得齐 */
  min-height:2.84em;
}
.rk:hover .nm{color:var(--paper)}
.rk .au{
  margin-top:3px;font-size:10px;line-height:1.4;min-height:1.4em;
  color:oklch(0.55 0.013 66);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ============ 移动端 ============ */
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:22px;padding-bottom:26px}
  .stage{justify-content:center;padding:0}
  .coverbox{width:min(54vw,200px);flex:none}
  /* 手机两侧还有 95px 空间，箭头整体挪到封面外，42px 手指目标 */
  .bnav{width:42px;height:42px}
  .bnav svg{width:19px;height:19px}
  .bnav.prev{left:-70px}
  .bnav.next{right:-70px}
  .coverbox .glow{inset:-14% -30% -8%}
  .meta{text-align:left}
  h1{font-size:clamp(26px,7.4vw,34px);margin-top:12px}
  .why{padding:16px 18px 16px 28px;width:auto}
  .why p{font-size:13.5px}
  .facts{padding-top:18px}
  .fact i{font-size:20px}
  .fact .bar{width:72px}
  .fact{padding-right:18px;margin-right:18px}
  .pb{flex:0 0 auto;width:56px}
}
@media (max-width:430px){
  /* 手机上封面 80~90px，一排 4 本，标签让位给封面 */
  .grid{gap:14px 8px}
  .rk .tg{display:none}
  .rk .nm{font-size:10.5px;margin-top:5px}
  .rk .au{font-size:9.5px;margin-top:2px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 auto;justify-content:center;padding:11px 14px}
  .sec-head{flex-wrap:wrap;gap:8px 12px}
}
@media (max-width:360px){
  .bnav.prev{left:-62px}
  .bnav.next{right:-62px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .rk .nm{font-size:10px}
}
/* ===== 浅色主题：纸底深墨，跟首页 Aa 的 cream / light / green 对齐 ===== */
html:not([data-theme="dark"]){--rule:#e4ded1}
html:not([data-theme="dark"]) .by{color:#5b6a63}
html:not([data-theme="dark"]) .why{background:linear-gradient(100deg,#fbf7ee 0%,#f5efe2 100%);border-left-color:#c08a4a}
html:not([data-theme="dark"]) .why p{color:#33443c}
html:not([data-theme="dark"]) .why .lb{color:#8a744f}
html:not([data-theme="dark"]) .prog .bar{background:#e3ddd0}
html:not([data-theme="dark"]) .prog .top b{color:#24312e}
html:not([data-theme="dark"]) .goal{color:#4c5a54}
html:not([data-theme="dark"]) .rk .nm{color:#33443c}
html:not([data-theme="dark"]) .rk .au{color:#7a877f}
html:not([data-theme="dark"]) .cover{box-shadow:0 22px 44px -12px rgba(58,48,32,.4),0 5px 14px rgba(58,48,32,.16),0 0 0 1px rgba(36,49,46,.08)}
html:not([data-theme="dark"]) .pb .th{box-shadow:0 3px 9px rgba(58,48,32,.2)}
html:not([data-theme="dark"]) .rk .th{box-shadow:0 8px 20px -6px rgba(58,48,32,.32),0 2px 6px rgba(58,48,32,.14)}
html:not([data-theme="dark"]) .rk:hover .th{box-shadow:0 18px 34px -8px rgba(58,48,32,.4),0 4px 12px rgba(58,48,32,.2)}
html:not([data-theme="dark"]) .sec-head{border-bottom-color:#e4ded1}
/* ===== 站内换卡：不刷新页面，内容淡入 180ms ===== */
@keyframes cardIn{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
#app.swap{animation:cardIn .18s var(--ease) both}
.cover img{opacity:0;transition:opacity .22s ease,transform .5s var(--ease)}
.cover img.ok{opacity:1}
@media (prefers-reduced-motion:reduce){
  .rk .th,.pb{transition-duration:.01ms}
  #app.swap{animation:none}
  .cover img{transition-duration:.01ms}
}

/* ============ 底部全文朗读播放器 ============
   规格与全书领读页（combined.html）的胶囊完全一致：40 方封面 + 倍速 + 设置 + 金色播放键，
   顶沿一条 2px 进度线。点按钮以外的地方 = 进全书领读，
   两页之间因此是「同一个组件换了个位置」，不突兀。 */
body{padding-bottom:104px}
.audio-dock{
  position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:60;
  width:min(440px,calc(100vw - 24px));box-sizing:border-box;
  display:flex;align-items:center;gap:10px;
  padding:8px 10px 8px 8px;border-radius:14px;overflow:hidden;

  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 32px rgba(0,0,0,.34);

  color:#e8e6e0;cursor:pointer;
  animation:dockIn .42s var(--ease) both;
}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
.audio-dock .ad-progress{
  position:absolute;left:0;top:0;height:2px;width:100%;

/* ===== 阅读设置（Aa）：字号 / 段距 / 主题 =====

<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html" id="back">← 返回</a>
    <div class="topmark" id="mark"></div>
  </div>
  <div id="app"><div class="loading">LOADING…</div></div>
</div>

<div class="bk-panel" id="bkPanel" hidden role="dialog" aria-label="阅读设置">
  <div class="bk-row"><span class="bk-lb">字号</span><span class="bk-btns">
    <button type="button" data-bk="fs-">A−</button><button type="button" data-bk="fs+">A＋</button></span></div>
  <div class="bk-row"><span class="bk-lb">段距</span><span class="bk-btns">
    <button type="button" data-bk="lh-">紧</button><button type="button" data-bk="lh0">中</button><button type="button" data-bk="lh+">松</button></span></div>
  <div class="bk-row"><span class="bk-lb">主题</span><span class="bk-btns">
    <button type="button" data-bk="th-cream">米白</button><button type="button" data-bk="th-light">纯白</button><button type="button" data-bk="th-green">护眼</button><button type="button" data-bk="th-dark">夜间</button></span></div>
</div>

<script>
(function(){
  "use strict";

  /* 阅读设置（Aa）：字号 / 段距 / 主题。
     ⚙ 从底部播放条弹出、落在播放条正上方；配置存 bk-cfg，
     主题与首页 Aa 共用 rd-cfg.theme，两处切换互相同步。 */
  var BkAa=(function(){
    var P=document.getElementById('bkPanel');
    var cfg={fs:1,lh:1};
    try{var o=JSON.parse(localStorage.getItem('bk-cfg')||'{}');
      if(o&&o.fs)cfg.fs=o.fs; if(o&&o.lh)cfg.lh=o.lh;}catch(e){}
    var FS=[0.92,1,1.08,1.16,1.26], LH=[0.9,1,1.12];
    function at(arr,v){var i=arr.indexOf(v);return i<0?1:i;}
    function apply(){
      document.documentElement.style.setProperty('--bk-fs',String(cfg.fs));
      document.documentElement.style.setProperty('--bk-lh',String(cfg.lh));
      try{localStorage.setItem('bk-cfg',JSON.stringify(cfg));}catch(e){}
      var th=document.documentElement.dataset.theme||'cream';
      var bs=P?P.querySelectorAll('[data-bk^="th-"]'):[];
      for(var i=0;i<bs.length;i++){
        bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-bk').slice(3)===th?'true':'false');
      }
    }
    if(!P) return {toggle:function(){},close:function(){}};
    P.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-bk]'):null; if(!b)return;
      var k=b.getAttribute('data-bk');
      if(k==='fs-') cfg.fs=FS[Math.max(0,at(FS,cfg.fs)-1)];
      else if(k==='fs+') cfg.fs=FS[Math.min(FS.length-1,at(FS,cfg.fs)+1)];
      else if(k==='lh-') cfg.lh=LH[Math.max(0,at(LH,cfg.lh)-1)];
      else if(k==='lh+') cfg.lh=LH[Math.min(LH.length-1,at(LH,cfg.lh)+1)];
      else if(k==='lh0') cfg.lh=1;
      else if(k.indexOf('th-')===0){
        var t=k.slice(3);
        document.documentElement.dataset.theme=t;
        try{var c=JSON.parse(localStorage.getItem('rd-cfg')||'{}');c.theme=t;
          localStorage.setItem('rd-cfg',JSON.stringify(c));}catch(err){}
      }
      apply();
    });
    document.addEventListener('click',function(e){
      if(P.hidden)return;
      if(e.target.closest&&(e.target.closest('#bkPanel')||e.target.closest('.ad-set')))return;
      P.hidden=true;
    });
    apply();
    return {
      toggle:function(){P.hidden=!P.hidden;if(!P.hidden)apply();},
      close:function(){P.hidden=true;}
    };
  })();
  window.BkAa=BkAa;
  var app=document.getElementById("app");
  var mark=document.getElementById("mark");

  // 卡片 / 书架 / 书单一次取全：站内换书不再请求，也不再刷新页面
  var cards=[], pool=[], paths=[], cardBy={}, poolBy={}, pathBy={};
  var cur="", nav={prev:null,next:null}, ready=false;

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function err(msg){
    nav={prev:null,next:null};
    app.innerHTML='<div class="errbox">这本书没找到。<br>'+esc(msg)+
      '<br><br><a style="color:#e8d8bc" href="index.html">回书卡频道</a></div>';
  }
  function shortName(a){
    a=String(a||"").replace(/^\s*\[[^\]]*\]\s*/,"").trim();
    var parts=a.split(/\s+(?=\[)/).filter(Boolean);
    return parts.length>2?parts.slice(0,2).join(" ")+" 等":a;
  }
  function readSlug(){
    try{ return new URLSearchParams(location.search).get("slug")||""; }catch(e){ return ""; }
  }
  function bookOf(sl){
    if(!sl) return null;
    return cardBy[sl]||(poolBy[sl]!==undefined?pool[poolBy[sl]]:null);
  }

  /* 返回：确定性离开书卡。
     1) 从书单页点封面进来 -> 回那条书单（保留它自己的定位）；
     2) 其余（首页、频道页、分享链接、直接打开）-> 一律回站点首页。
     不用 history.back()：站内换书 pushState 过后，历史里会有好几条 book.html，
     back 只会在书卡之间来回跳，看起来像死循环。replace 也不给历史再添一条。 */
  /* 返回：按来源回各自的入口。
     1) 从首页书单 tab 点进来（?from=booklist）-> 回首页并停在书单 tab；
        站内换书会 replaceState 掉查询串，所以来源同时记进 sessionStorage；
     2) 老的频道列表页（channel/list.html）-> 回那条列表；
     3) 书卡画廊（channel/）-> 回画廊；
     4) 其余（首页、分享链接、直接打开）-> 回首页。
     不用 history.back()：站内换书只 replace 不 push，back 的落点不可靠。 */
  var BACK_KEY="bk-from";
  function readFrom(){
    try{
      var q=new URLSearchParams(location.search).get("from");
      if(q){ try{sessionStorage.setItem(BACK_KEY,q);}catch(e){} return q; }
      return sessionStorage.getItem(BACK_KEY)||"";
    }catch(e){ return ""; }
  }
  var exitUrl=(function(){
    var ref=document.referrer||"", from=readFrom();
    if(from==="booklist") return "../index.html#shuDan";
    if(/\/channel\/list\.html/.test(ref)) return ref;
    if(/\/channel\/(index\.html)?(\?[^#]*)?$/.test(ref)) return "index.html";
    return "../index.html";
  })();
  document.getElementById("back").addEventListener("click",function(e){
    e.preventDefault();
    try{sessionStorage.removeItem(BACK_KEY);}catch(err){}
    location.replace(exitUrl);
  });

  /* 站内换书：拦掉整页跳转，只重渲染内容区 */
  app.addEventListener("click",function(e){
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;
    if(!a||!app.contains(a)) return;
    var m=/^book\.html\?slug=([^&]+)$/.exec(a.getAttribute("href")||"");
    if(!m) return;
    e.preventDefault();
    go(decodeURIComponent(m[1]));
  });

  window.addEventListener("popstate",function(){
    var sl=readSlug();
    if(ready&&sl) render(sl);
  });

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.shiftKey) return;
    var t=e.target;
    if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if(e.key==="ArrowLeft"&&nav.prev){ e.preventDefault(); go(nav.prev); }
    else if(e.key==="ArrowRight"&&nav.next){ e.preventDefault(); go(nav.next); }
  });

  fetch("cards.json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      cards=d.cards||[]; pool=d.pool||[]; paths=d.paths||[];
      cards.forEach(function(c){ cardBy[c.slug]=c; });
      pool.forEach(function(p,i){ poolBy[p.s]=i; });
      paths.forEach(function(p){ pathBy[p.id]=p; });
      ready=true;
      render(readSlug());
    })
    .catch(function(e){ err(e.message); });

  function go(sl){
    if(!sl||sl===cur) return;
    try{
      // 用 replace 而不是 push：书卡里连翻十本也只占一条历史，
      // 浏览器返回键一下就能离开书卡，不会在书卡之间来回跳。
      history.replaceState({slug:sl},"","book.html?slug="+encodeURIComponent(sl));
    }catch(e){
      location.href="book.html?slug="+encodeURIComponent(sl); return;
    }
    render(sl);
    window.scrollTo(0,0);
  }

  // 关联：书单内的书用生成好的 sib；书架里没进书单的书，现场按分类相似度挑
  function related(sl){
    var me=cardBy[sl];
    if(me&&me.sib&&me.sib.length){
      return me.sib.map(function(idx,k){
        var b=pool[idx]; if(!b) return null;
        return {b:b,tag:(me.sibTag||[])[k]||""};
      }).filter(Boolean);
    }
    var self=poolBy[sl]===undefined?null:pool[poolBy[sl]];
    if(!self) return [];
    var sc=[], selfName=shortName(self.a);
    pool.forEach(function(b){
      if(b.s===sl) return;
      var s=0,tag="";
      if(selfName&&b.a&&shortName(b.a)===selfName){ s=6; tag="同作者"; }
      if(self.c&&b.c===self.c){ s+=3.6; tag=tag||"同题材"; }
      else if(self.c&&b.c&&self.c.split("-")[0]===b.c.split("-")[0]){ s+=2; tag=tag||"同领域"; }
      if(s>0.5) sc.push({s:s,b:b,tag:tag});
    });
    sc.sort(function(x,y){ return y.s-x.s; });
    return sc.slice(0,14).map(function(x){ return {b:x.b,tag:x.tag}; });
  }

  /* ============ 底部全文朗读播放器 ============
     复用全文页 reader.js 的云端 TTS（POST /tts → audio/mpeg）。
     进页面即后台预合成首块，点播放时缓存命中、秒开；逐块预取，块间不断。
     云端不可用时退回本机 Web Speech。默认静默，绝不自动出声。 */
  var Dock=(function(){
    var TTS='https://a32eb29ccf0373711.app.workbuddy.host/tts?sharecode=N3AWQXFAIQ';
    var RATES=[1,1.25,1.5,2],ri=0;
    var el=null,coverEl,titleEl,subEl,playEl,rateEl,setEl,barEl,audio=null,dockHref='';
    var chunks=[],ci=0,curSlug='',playing=false,useLocal=false;
    var cache={},pending={};

    function ic(paused){
      return paused
        ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.3v13.4c0 .8.9 1.3 1.6.9l10-6.7c.6-.4.6-1.4 0-1.8L9.6 4.4C8.9 4 8 4.5 8 5.3z"/></svg>';
    }
    function build(){
      if(el)return;
      el=document.createElement('div');
      el.className='audio-dock';el.setAttribute('role','group');el.setAttribute('aria-label','全文朗读播放器');
      el.innerHTML='<div class="ad-progress"><i></i></div>'+
        '<div class="ad-cover"></div>'+
        '<div class="ad-meta"><div class="ad-title"></div><div class="ad-sub">准备全文…</div></div>'+
        '<button class="ad-rate" type="button" aria-label="播放速度" title="播放速度">1×</button>'+
        '<button class="ad-set" type="button" aria-label="阅读设置" title="字号 / 段距 / 主题">⚙</button>'+
        '<button class="ad-play" type="button" aria-label="播放" disabled>'+ic(false)+'</button>';
      document.body.appendChild(el);
      coverEl=el.querySelector('.ad-cover');titleEl=el.querySelector('.ad-title');
      subEl=el.querySelector('.ad-sub');playEl=el.querySelector('.ad-play');
      rateEl=el.querySelector('.ad-rate');barEl=el.querySelector('.ad-progress i');
      setEl=el.querySelector('.ad-set');
      playEl.addEventListener('click',toggle);
      rateEl.addEventListener('click',function(){
        ri=(ri+1)%RATES.length;rateEl.textContent=RATES[ri]+'×';
        if(audio)audio.playbackRate=RATES[ri];
      });
      /* ⚙ 打开阅读设置（字号/段距/主题），和全书领读页的 Aa 是同一件事 */
      setEl.addEventListener('click',function(e){
        e.stopPropagation();
        if(window.BkAa) window.BkAa.toggle();
      });
      /* 点播放条上「按钮以外」的地方：进全书领读。
         这样两页的播放器是同一个组件，位置不同而已，跳转不突兀。 */
      el.addEventListener('click',function(e){
        e.stopPropagation();
        if(e.target.closest('button')) return;
        if(dockHref) location.href=dockHref;
      });
      el.title='点这里进全书领读';
    }
    function sub(t){if(subEl)subEl.textContent=t;}
    function bar(p){if(barEl)barEl.style.width=(Math.min(1,Math.max(0,p))*100)+'%';}
    function extract(html){
      var doc=new DOMParser().parseFromString(html,'text/html'),out=[];
      var secs=doc.querySelectorAll('section[data-key]');
      Array.prototype.forEach.call(secs,function(s){
        if(s.getAttribute('data-key')==='svg')return;
        var c=s.cloneNode(true);
        Array.prototype.forEach.call(c.querySelectorAll('svg,script,style,.mmx-mod-note,.mmx-stat'),function(n){n.remove();});
        var t=(c.textContent||'').replace(/\s+/g,' ').trim();
        if(t)out.push(t);
      });
      return out.join('。').replace(/。{2,}/g,'。').trim();
    }
    function fallback(card){
      if(!card)return '';
      var a=[card.t||'',card.w||''];
      (card.q||[]).forEach(function(x){a.push(x);});
      return a.join('。').replace(/。{2,}/g,'。').trim();
    }
    function chunk(text){
      var parts=text.replace(/([。！？!?；;])/g,'$1\u0000').split('\u0000'),out=[],buf='',SIZE=110;
      parts.forEach(function(p){
        p=p.trim();if(!p)return;
        if((buf+p).length>SIZE&&buf){out.push(buf);buf=p;}else buf+=p;
      });
      if(buf)out.push(buf);
      var fin=[];
      out.forEach(function(b){
        while(b.length>SIZE*1.5){fin.push(b.slice(0,SIZE));b=b.slice(SIZE);}
        if(b)fin.push(b);
      });
      return fin;
    }
    function synth(text){
      var clean=TTS.replace(/[?&]$/,'');
      return fetch(clean,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:text,voice:'zh-CN-XiaoxiaoNeural',rate:'+0%'})})
        .then(function(r){if(!r.ok)throw new Error('tts '+r.status);return r.blob();});
    }
    function getAudio(){
      if(!audio){
        audio=new Audio();audio.preload='auto';
        audio.addEventListener('ended',function(){if(playing)at(ci+1);});
        audio.addEventListener('timeupdate',function(){
          if(audio.duration)bar((ci+audio.currentTime/audio.duration)/Math.max(1,chunks.length));
        });
      }
      return audio;
    }
    function key(i){return curSlug+'#'+i;}
    function ensure(i,cb){
      var k=key(i);
      if(cache[k]){cb(cache[k]);return;}
      if(pending[k]){pending[k].push(cb);return;}
      pending[k]=[cb];
      synth(chunks[i]).then(function(b){
        var u=URL.createObjectURL(b);cache[k]=u;
        var list=pending[k];delete pending[k];
        list.forEach(function(f){f(u);});
      }).catch(function(){
        var list=pending[k];delete pending[k];
        list.forEach(function(f){f(null);});
      });
    }
    function prefetch(i){
      if(i>=chunks.length)return;
      var k=key(i);
      if(cache[k]||pending[k])return;
      ensure(i,function(){});
    }
    function localSpeak(i){
      useLocal=true;
      if(!('speechSynthesis' in window)){sub('语音服务暂时不可用');halt();return;}
      try{window.speechSynthesis.cancel();}catch(e){}
      var u=new SpeechSynthesisUtterance(chunks[i]);u.lang='zh-CN';u.rate=RATES[ri];
      u.onend=function(){if(playing)at(ci+1);};
      u.onerror=function(){if(playing)at(ci+1);};
      try{window.speechSynthesis.speak(u);}catch(e){}
      sub('朗读中（本机语音）· '+(i+1)+'/'+chunks.length);
    }
    function at(i){
      if(i>=chunks.length){halt();bar(1);sub('朗读完成');return;}
      ci=i;bar(i/Math.max(1,chunks.length));
      if(!useLocal)sub('朗读中 · '+(i+1)+'/'+chunks.length);
      ensure(i,function(u){
        if(!playing||ci!==i)return;
        if(u){
          var a=getAudio();a.src=u;a.playbackRate=RATES[ri];
          var p=a.play();if(p&&p.catch)p.catch(function(){localSpeak(i);});
          prefetch(i+1);
        }else localSpeak(i);
      });
    }
    function halt(){
      playing=false;
      if(audio){try{audio.pause();}catch(e){}}
      if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
      if(playEl){playEl.innerHTML=ic(false);playEl.setAttribute('aria-label','播放');}
    }
    function toggle(){
      if(!chunks.length)return;
      if(playing){
        playing=false;
        if(useLocal){try{window.speechSynthesis.pause();}catch(e){}}
        else if(audio){try{audio.pause();}catch(e){}}
        playEl.innerHTML=ic(false);playEl.setAttribute('aria-label','继续播放');
        sub('已暂停 · '+(ci+1)+'/'+chunks.length);
      }else{
        playing=true;playEl.innerHTML=ic(true);playEl.setAttribute('aria-label','暂停');
        if(!useLocal)sub('朗读中 · '+(ci+1)+'/'+chunks.length);
        if(useLocal){try{window.speechSynthesis.resume();}catch(e){}}
        else if(audio&&audio.src&&!audio.ended){var p=audio.play();if(p&&p.catch)p.catch(function(){});}
        else at(ci);
      }
    }
    function loadText(slug,card,cb){
      var base='../reading-notes/books/'+encodeURIComponent(slug)+'/';
      fetch(base+'combined-data.html',{cache:'no-cache'})
        .then(function(r){if(!r.ok)throw new Error('no data');return r.text();})
        .then(function(h){var t=extract(h);if(t.length>40){cb(t);return;}throw new Error('empty');})
        .catch(function(){
          return fetch(base+'overview.html',{cache:'no-cache'})
            .then(function(r){if(!r.ok)throw new Error('no ov');return r.text();})
            .then(function(h){var t=extract(h);if(t.length>40){cb(t);return;}throw new Error('empty');})
            .catch(function(){cb(fallback(card));});
        });
    }
    function load(slug,title,cover,card,href){
      build();halt();
      curSlug=slug;ci=0;chunks=[];useLocal=false;bar(0);dockHref=href||'';
      titleEl.textContent=title||'全书朗读';
      coverEl.innerHTML=cover?'<img src="'+esc(cover)+'" alt="" onerror="this.style.display=&#39;none&#39;">':'';
      playEl.disabled=true;playEl.innerHTML=ic(false);playEl.setAttribute('aria-label','播放');
      rateEl.textContent=RATES[ri]+'×';sub('准备全文…');
      loadText(slug,card,function(text){
        if(slug!==curSlug)return;
        chunks=chunk(text);
        if(!chunks.length){sub('暂无可朗读的正文');return;}
        playEl.disabled=false;sub('点播放听全文 · 点这里进领读');
        prefetch(0); /* 后台提前合成首块 → 点播放时秒开 */
      });
    }
    build();
    /* AI听书：从书名下方直接开播。正在播时再点不打断（只提示），
       避免「AI听书」这个标签点一下反而暂停。 */
    function play(){
      if(!chunks.length){ sub('正文还在准备…'); return; }
      if(!playing) toggle(); else sub('正在朗读全文 · 播放条上可暂停');
    }
    return {load:load,play:play};
  })();

  function render(sl){
    cur=sl;
    var c=cardBy[sl]||null;
    var b=c||(poolBy[sl]!==undefined?pool[poolBy[sl]]:null);
    if(!b){ err("没有 slug="+sl); return; }

    var title=c?c.t:b.t;
    var author=shortName(c?c.a:(b.a||""));
    var cat=(c?(c.cat||c.f):b.c)||"";
    var cover=c?c.cover:b.cv;
    var href=c?c.href:b.h;
    var why=c?c.w:"";
    // 原文摘录：构建期从 combined-data.html 的 ul.quote 里提好，页面不再额外请求
    var quotes=(c&&c.q&&c.q.length?c.q:((b&&b.q)||[])).slice(0,3);
    var p=c?pathBy[c.p]:null;
    // 封面点击 = 回到这条书单，并把当前这本滚到视野里（与「看整条书单」同一个去处）
    var listHref=p?'list.html?id='+encodeURIComponent(p.id)+'&book='+encodeURIComponent(sl):'';
    var coverHref=listHref||href||'';
    var hue=c?c.hue:null;

    document.title=title+" · 书卡详情";
    mark.innerHTML='<b>'+esc(cat||"书卡")+'</b> · 书卡详情';

    // 书单轨迹：整条单按阶段顺序铺开，标出当前这本的位次
    var strip="", stripNo=0;
    if(p&&p.stages){
      p.stages.forEach(function(st){
        st.slugs.forEach(function(s){
          stripNo++;
          var pb=cardBy[s]||null;
          var cv=pb?pb.cover:(poolBy[s]!==undefined?pool[poolBy[s]].cv:"");
          var on=s===sl;
          strip+='<a class="pb'+(on?" on":"")+'" href="book.html?slug='+encodeURIComponent(s)+'"'+
                 (on?' aria-current="page"':'')+' title="'+esc(pb?pb.t:s)+'">'+
                 '<div class="th"><img src="'+esc(cv)+'" alt="" loading="lazy" decoding="async" onerror="this.style.display=&#39;none&#39;"></div>'+
                 '<div class="n">'+String(stripNo).padStart(2,"0")+'</div></a>';
        });
      });
    }

    // kicker：分类 · 书单位次 · 阶段，同一项只出现一次
    var parts=[];
    var catTxt=(cat||"书架").replace(/-/g," · ");
    parts.push('<b>'+esc(catTxt)+'</b>');
    if(p&&p.field&&p.field!==catTxt&&p.field!==cat) parts.push('<span>'+esc(p.field)+'</span>');
    if(c&&c.pn) parts.push('<span>第 '+(c.pi||0)+' / '+c.pn+' 本</span>');
    if(c&&c.stn) parts.push('<span>第 '+c.st+' / '+c.stn+' 步</span>');
    var kicker=parts.join('<span class="dot"></span>');

    // 书单顺序摊平，取前后两本 → 封面左右翻页箭头
    var seq=[];
    if(p&&p.stages){
      p.stages.forEach(function(st){ (st.slugs||[]).forEach(function(x){ seq.push(x); }); });
    }
    var pIdx=seq.indexOf(sl);
    var prevSlug=pIdx>0?seq[pIdx-1]:null;
    var nextSlug=(pIdx>=0&&pIdx<seq.length-1)?seq[pIdx+1]:null;
    nav={prev:prevSlug,next:nextSlug};

    var chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>';
    function navBtn(s,dir){
      var lb=dir==="prev"?"上一本":"下一本";
      if(!s){
        return '<span class="bnav '+dir+'" aria-disabled="true" aria-label="已经是书单的'+(dir==="prev"?"第一本":"最后一本")+'">'+chev+'</span>';
      }
      var ob=bookOf(s), t=ob?(ob.t||ob.tFull||""):"";
      return '<a class="bnav '+dir+'" href="book.html?slug='+encodeURIComponent(s)+'" '+
        'aria-label="'+lb+'：'+esc(t)+'" title="'+lb+' · '+esc(t)+'">'+chev+'</a>';
    }
    var prevBtn=pIdx>=0?navBtn(prevSlug,"prev"):"";
    var nextBtn=pIdx>=0?navBtn(nextSlug,"next"):"";

    var quoteBlock=quotes.length
      ? '<div class="quotes"><div class="qh"><span>原文摘录</span><em>EXCERPTS</em></div><ul>'+
          quotes.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+
        '</ul></div>'
      : '';

    var html='<section class="hero">'+
      '<div class="stage">'+
        '<div class="coverbox">'+
          '<div class="glow" style="--h:'+(hue==null?66:hue)+'"></div>'+
          prevBtn+
          '<a class="cover" '+(coverHref?'href="'+esc(coverHref)+'" ':'')+
            'aria-label="'+esc(title)+(listHref?' · 在书单中定位':(href?' · 打开笔记':''))+'"'+
            (coverHref?' title="'+(listHref?'在书单中定位：':'打开笔记：')+esc(title)+'"':'')+
            ' style="--h:'+(hue==null?62:hue)+'">'+
            '<div class="ph">'+esc(title)+'</div>'+
            '<img src="'+esc(cover)+'" alt="'+esc(title)+' 封面" decoding="async" onerror="this.style.display=&#39;none&#39;">'+
          '</a>'+
          nextBtn+
        '</div>'+
      '</div>'+
      '<div class="meta">'+
        '<div class="kicker">'+kicker+'</div>'+
        '<h1><a href="https://weread.qq.com/web/search/books?keyword='+
          encodeURIComponent(title)+'" title="在微信读书搜索：'+esc(title)+'">'+esc(title)+'</a></h1>'+
        '<div class="metahead">'+
          (author?'<div class="by">'+esc(author)+'</div>':'')+
          '<div class="h1cta">'+
            '<a class="cta cta-read" href="'+esc(href)+'" aria-label="AI 阅读：打开《'+esc(title)+'》全书领读">'+
              '<span class="cta-emoji" aria-hidden="true">👉</span>AI阅读</a>'+
            '<button type="button" class="cta cta-listen" id="ctaListen" aria-label="AI 听书：朗读《'+esc(title)+'》全文">'+
              '<span class="cta-emoji" aria-hidden="true">👉</span>AI听书</button>'+
          '</div>'+
        '</div>'+
        
        (why?'<div class="why"><span class="q">“</span><p>'+esc(why)+'</p><div class="lb">Why this one</div></div>':'')+
        quoteBlock+
        (p?'<div class="actions">'+
          '<a class="btn btn-ghost" href="list.html?id='+encodeURIComponent(p.id)+'&book='+encodeURIComponent(sl)+'">看整条书单 →</a>'+
        '</div>':'')+
      '</div>'+
    '</section>';

    if(strip){
      html+='<section class="sec">'+
        '<div class="sec-head"><span class="no">01</span><h2>这条书单</h2>'+
          '<em>'+esc(p.title)+' · '+p.n+' 本</em>'+
          '<a class="more" href="list.html?id='+encodeURIComponent(p.id)+'&book='+encodeURIComponent(sl)+'">看目录 →</a>'+
        '</div>'+
        '<div class="strip">'+strip+'</div>';
      if(p.goal) html+='<p class="goal"><span>书单简介</span>'+esc(p.goal)+'</p>';
      html+='</section>';
    }

    var rel=related(sl);
    if(rel.length){
      html+='<section class="sec">'+
        '<div class="sec-head"><span class="no">02</span><h2>关联阅读</h2>'+
          '<em>'+rel.length+' 本 · 按关联度排</em></div>'+
        '<div class="grid">';
      rel.forEach(function(r){
        var tag=r.tag||"";
        var cls=tag==="同作者"?" is-author":(tag==="同一步"?" is-step":"");
        html+='<a class="rk" href="book.html?slug='+encodeURIComponent(r.b.s)+'">'+
          '<div class="th"><img src="'+esc(r.b.cv)+'" alt="'+esc(r.b.t)+'" loading="lazy" decoding="async" onerror="this.style.display=&#39;none&#39;">'+
            (tag?'<span class="tg'+cls+'">'+esc(tag)+'</span>':'')+
          '</div>'+
          '<div class="nm">'+esc(r.b.t)+'</div>'+
          '<div class="au">'+esc(shortName(r.b.a)||String(r.b.c||"").replace(/-/g," · "))+'</div></a>';
      });
      html+='</div></section>';
    }

    html+='<div class="footnav">'+
      '<a class="btn btn-primary" href="index.html">回书卡频道</a>'+
      '<a class="btn btn-ghost" href="'+esc(href)+'">直接读这本</a>'+
      '</div>';

    app.innerHTML=html;

    // 换卡入场：同一个节点重播动画，不做整页刷新
    app.classList.remove("swap");
    void app.offsetWidth;
    app.classList.add("swap");

    // 封面图淡入，切换时不会先白一下
    var im=app.querySelector(".cover img");
    if(im){
      var ok=function(){ im.classList.add("ok"); };
      if(im.complete&&im.naturalWidth) ok();
      else im.addEventListener("load",ok);
    }

    // 轨迹条把当前这本滚到容器中间。
    // 注意不能用 scrollIntoView：它会把整个文档一起滚，页面一加载就自己往上跳。
    var on=app.querySelector(".pb.on");
    var stripEl=app.querySelector(".strip");
    if(on&&stripEl){
      stripEl.scrollLeft=Math.max(0,
        on.offsetLeft-(stripEl.clientWidth-on.offsetWidth)/2);
    }

    // 书名下方的「AI听书」：直接开播底部播放器
    var ctaL=document.getElementById('ctaListen');
    if(ctaL) ctaL.addEventListener('click',function(){
      if(Dock.play) Dock.play(); else location.href=href;
    });

    // 底部全文朗读播放器：跟随当前书切换，后台预合成首块
    Dock.load(sl,title,cover,c||b,href);
  }
})();
</script>
</body>
</html>
